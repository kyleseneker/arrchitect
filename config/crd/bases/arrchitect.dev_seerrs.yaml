---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: seerrs.arrchitect.dev
spec:
  group: arrchitect.dev
  names:
    categories:
    - arrchitect
    kind: Seerr
    listKind: SeerrList
    plural: seerrs
    singular: seerr
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Seerr configures a Seerr instance the operator connects to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of the Seerr.
            properties:
              connection:
                description: connection defines how to connect to the Seerr instance.
                properties:
                  apiKeySecretRef:
                    description: |-
                      apiKeySecretRef references a Secret containing Seerr's API key. When set,
                      it is used instead of logging in through the media server.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tls:
                    description: |-
                      tls configures TLS settings for the connection.
                      Only needed when Seerr uses HTTPS with self-signed or private CA certificates.
                    properties:
                      caSecretRef:
                        description: |-
                          caSecretRef references a Secret containing a PEM-encoded CA certificate bundle
                          used to verify the target app's TLS certificate.
                          The Secret must contain the CA certificate under the specified key.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            minLength: 1
                            type: string
                          name:
                            description: name is the name of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      insecureSkipVerify:
                        description: |-
                          insecureSkipVerify disables TLS certificate verification.
                          WARNING: This makes the connection susceptible to machine-in-the-middle attacks.
                          Only use for testing or when the target app uses a self-signed certificate and
                          providing a CA is not practical.
                        type: boolean
                    type: object
                  url:
                    description: url is the base URL of the Seerr instance (e.g.,
                      http://jellyseerr.media.svc.cluster.local:5055).
                    minLength: 1
                    pattern: ^https?://
                    type: string
                required:
                - url
                type: object
              jellyfinAuth:
                description: |-
                  jellyfinAuth defines Jellyfin authentication settings.
                  Set this for Jellyfin-based Seerr instances. Mutually exclusive with plexAuth.
                minProperties: 1
                properties:
                  appRef:
                    description: |-
                      appRef names the Jellyfin resource whose connection URL and admin user are
                      used in place of hostname, port, useSsl, urlBase, usernameSecretRef and
                      passwordSecretRef.
                    properties:
                      group:
                        default: arrchitect.dev
                        description: group is the resource's API group.
                        enum:
                        - arrchitect.dev
                        type: string
                      kind:
                        description: kind is the resource's kind, such as Sonarr.
                        enum:
                        - Sonarr
                        - Radarr
                        - Lidarr
                        - Readarr
                        - Prowlarr
                        - Seerr
                        - Jellyfin
                        - Plex
                        - QBittorrent
                        - Sabnzbd
                        type: string
                      name:
                        description: name is the resource's name.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: jellyfinAuth refers to a Jellyfin
                      rule: self.kind == 'Jellyfin'
                  hostname:
                    description: hostname is the Jellyfin server hostname.
                    minLength: 1
                    type: string
                  passwordSecretRef:
                    description: passwordSecretRef references a Secret containing
                      the Jellyfin password.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  port:
                    description: port is the Jellyfin server port.
                    format: int32
                    type: integer
                  urlBase:
                    description: urlBase is the subpath Jellyfin is served under,
                      if any.
                    minLength: 1
                    type: string
                  useSsl:
                    description: useSsl enables SSL for the Jellyfin connection.
                    type: boolean
                  usernameSecretRef:
                    description: usernameSecretRef references a Secret containing
                      the Jellyfin username.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set appRef, or hostname, port, usernameSecretRef and passwordSecretRef,
                    not both
                  rule: 'has(self.appRef) ? !has(self.hostname) && !has(self.port)
                    && !has(self.useSsl) && !has(self.urlBase) && !has(self.usernameSecretRef)
                    && !has(self.passwordSecretRef) : has(self.hostname) && has(self.port)
                    && has(self.usernameSecretRef) && has(self.passwordSecretRef)'
              jobSchedules:
                description: |-
                  jobSchedules sets when Seerr runs its scheduled jobs. Jobs left out keep
                  their schedules.
                items:
                  description: SeerrJobSchedule sets when Seerr runs one of its jobs.
                  properties:
                    id:
                      description: |-
                        id is the job. Seerr runs the plex- jobs only with Plex, and the
                        jellyfin- jobs only with Jellyfin or Emby.
                      enum:
                      - plex-recently-added-scan
                      - plex-full-scan
                      - plex-watchlist-sync
                      - plex-refresh-token
                      - radarr-scan
                      - sonarr-scan
                      - download-sync
                      - download-sync-reset
                      - jellyfin-recently-added-scan
                      - jellyfin-full-scan
                      - image-cache-cleanup
                      - availability-sync
                      - process-blocklisted-tags
                      type: string
                    schedule:
                      description: |-
                        schedule is a cron expression with a leading seconds field, such as
                        "0 */5 * * * *" for every five minutes.
                      minLength: 1
                      type: string
                  required:
                  - id
                  - schedule
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              libraries:
                description: |-
                  libraries names the media server's libraries Seerr shows and takes
                  requests for. Those are enabled and the rest disabled, on every pass.
                  Left out, first-time setup enables every library and later passes leave
                  them as they are.
                items:
                  minLength: 1
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              main:
                description: main configures general application settings.
                properties:
                  applicationTitle:
                    description: applicationTitle is the application display title.
                    minLength: 1
                    type: string
                  applicationUrl:
                    description: applicationUrl is the external URL for the application.
                    minLength: 1
                    type: string
                  blocklistLanguages:
                    description: |-
                      blocklistLanguages limits the job to media originally in these ISO
                      639-1 languages, apart from originalLanguages.
                    items:
                      pattern: ^[a-z]{2}$
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  blocklistRegion:
                    description: |-
                      blocklistRegion is the ISO 3166-1 region the job searches, apart from
                      discoverRegion.
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                  blocklistedTags:
                    description: |-
                      blocklistedTags are TMDB keyword IDs whose media Seerr's Process
                      Blocklisted Tags job adds to the blocklist. The job drops an ID TMDB
                      doesn't know, and the operator puts it back.
                    items:
                      format: int32
                      minimum: 1
                      type: integer
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  blocklistedTagsLimit:
                    description: |-
                      blocklistedTagsLimit is how many pages of results the job blocklists
                      per tag and sort order. A new Seerr takes 50.
                    format: int32
                    maximum: 250
                    minimum: 1
                    type: integer
                  cacheImages:
                    description: |-
                      cacheImages caches images from TMDB and other sources, which takes a lot
                      of disk space.
                    type: boolean
                  defaultPermissions:
                    description: defaultPermissions is the default permission bitmask
                      for new users.
                    format: int32
                    type: integer
                  defaultQuotas:
                    description: |-
                      defaultQuotas limits how much users without a quota of their own can
                      request.
                    minProperties: 1
                    properties:
                      movie:
                        description: movie limits movie requests.
                        minProperties: 1
                        properties:
                          days:
                            description: |-
                              days is the window, in days, that requests count toward limit. 0 counts
                              every request ever made.
                            format: int32
                            minimum: 0
                            type: integer
                          limit:
                            description: |-
                              limit is how many requests count before the user is stopped. 0 is
                              unlimited.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      tv:
                        description: tv limits series requests, counted in seasons.
                        minProperties: 1
                        properties:
                          days:
                            description: |-
                              days is the window, in days, that requests count toward limit. 0 counts
                              every request ever made.
                            format: int32
                            minimum: 0
                            type: integer
                          limit:
                            description: |-
                              limit is how many requests count before the user is stopped. 0 is
                              unlimited.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                    type: object
                  discoverRegion:
                    description: |-
                      discoverRegion limits discovery to what's released in this ISO 3166-1
                      region, such as US.
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                  enableSpecialEpisodes:
                    description: enableSpecialEpisodes lets users request a series'
                      specials.
                    type: boolean
                  hideAvailable:
                    description: hideAvailable hides already-available media from
                      discovery.
                    type: boolean
                  hideBlocklisted:
                    description: |-
                      hideBlocklisted hides blocklisted media from discovery for users who
                      manage the blocklist.
                    type: boolean
                  hideRequested:
                    description: hideRequested hides requested media from discovery.
                    type: boolean
                  localLogin:
                    description: localLogin enables local user login.
                    type: boolean
                  locale:
                    description: locale is the application locale (e.g., "en").
                    minLength: 1
                    type: string
                  mediaServerLogin:
                    description: mediaServerLogin enables login via the media server
                      (Jellyfin).
                    type: boolean
                  newMediaServerLogin:
                    description: |-
                      newMediaServerLogin lets media server users sign in before they're
                      imported, creating their Seerr user.
                    type: boolean
                  originalLanguages:
                    description: |-
                      originalLanguages limits discovery to media originally in these ISO
                      639-1 languages, such as en.
                    items:
                      pattern: ^[a-z]{2}$
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  partialRequestsEnabled:
                    description: partialRequestsEnabled enables partial season/episode
                      requests.
                    type: boolean
                  streamingRegion:
                    description: |-
                      streamingRegion is the ISO 3166-1 region whose streaming services Seerr
                      shows.
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                  versionCheck:
                    description: versionCheck checks GitHub for new Seerr releases.
                    type: boolean
                  youtubeUrl:
                    description: |-
                      youtubeUrl is the base URL trailers play from, for a self-hosted
                      YouTube frontend.
                    minLength: 1
                    pattern: ^https?://
                    type: string
                type: object
              metadataProviders:
                description: |-
                  metadataProviders chooses where Seerr gets series and anime metadata.
                  Seerr checks it can reach the providers chosen before it saves them.
                minProperties: 1
                properties:
                  anime:
                    description: 'anime is the provider for anime series: tmdb or
                      tvdb.'
                    enum:
                    - tmdb
                    - tvdb
                    type: string
                  tv:
                    description: 'tv is the provider for series: tmdb or tvdb.'
                    enum:
                    - tmdb
                    - tvdb
                    type: string
                type: object
              network:
                description: network configures how Seerr treats the network in front
                  of it.
                minProperties: 1
                properties:
                  trustProxy:
                    description: |-
                      trustProxy has Seerr take client addresses from the proxy in front of it,
                      such as an ingress controller. Seerr applies it when it restarts.
                    type: boolean
                type: object
              notifications:
                description: |-
                  notifications configures notification agents (Discord, Slack, Telegram, etc.).
                  Each agent is a singleton — only one configuration per agent type.
                items:
                  description: SeerrNotificationAgent configures a single notification
                    agent in Seerr.
                  properties:
                    agent:
                      description: |-
                        agent is the notification agent type.
                        Supported values: discord, slack, telegram, pushover, email, webhook,
                        gotify, ntfy, pushbullet, webpush.
                      minLength: 1
                      type: string
                    enabled:
                      description: enabled enables this notification agent.
                      type: boolean
                    options:
                      description: |-
                        options are the agent's settings, such as botUsername or chatId, each a
                        value or read from a Secret, such as webhookUrl or botAPI. Values keep
                        their type, so enableMentions: false is off.
                      items:
                        description: |-
                          ConfigField is a named field of a provider's configuration. It sets value
                          or valueFrom, not both.
                        maxProperties: 2
                        properties:
                          name:
                            description: name is the field name.
                            minLength: 1
                            type: string
                          value:
                            description: 'value is the field value: a string, number,
                              boolean or list.'
                            x-kubernetes-preserve-unknown-fields: true
                          valueFrom:
                            description: valueFrom reads the field value from a source.
                            properties:
                              secretKeyRef:
                                description: secretKeyRef reads the value from a key
                                  of a Secret in the resource's namespace.
                                properties:
                                  key:
                                    description: key is the key within the Secret.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: name is the name of the Secret.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - secretKeyRef
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    types:
                      description: types are the events that send a notification.
                        An empty list sends none.
                      items:
                        enum:
                        - mediaPending
                        - mediaApproved
                        - mediaAutoApproved
                        - mediaAutoRequested
                        - mediaAvailable
                        - mediaFailed
                        - mediaDeclined
                        - issueCreated
                        - issueComment
                        - issueResolved
                        - issueReopened
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - agent
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - agent
                x-kubernetes-list-type: map
              plexAuth:
                description: |-
                  plexAuth defines Plex authentication settings.
                  Set this for Plex-based Seerr instances. Mutually exclusive with jellyfinAuth.
                minProperties: 1
                properties:
                  appRef:
                    description: |-
                      appRef names the Plex resource whose connection URL and token are used in
                      place of hostname, port, useSsl and tokenSecretRef.
                    properties:
                      group:
                        default: arrchitect.dev
                        description: group is the resource's API group.
                        enum:
                        - arrchitect.dev
                        type: string
                      kind:
                        description: kind is the resource's kind, such as Sonarr.
                        enum:
                        - Sonarr
                        - Radarr
                        - Lidarr
                        - Readarr
                        - Prowlarr
                        - Seerr
                        - Jellyfin
                        - Plex
                        - QBittorrent
                        - Sabnzbd
                        type: string
                      name:
                        description: name is the resource's name.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: plexAuth refers to a Plex
                      rule: self.kind == 'Plex'
                  hostname:
                    description: hostname is the Plex server hostname.
                    minLength: 1
                    type: string
                  port:
                    description: port is the Plex server port. Defaults to 32400.
                    format: int32
                    type: integer
                  tokenSecretRef:
                    description: tokenSecretRef references a Secret containing the
                      Plex auth token.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  useSsl:
                    description: useSsl enables SSL for the Plex connection.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: set appRef, or hostname and tokenSecretRef, not both
                  rule: 'has(self.appRef) ? !has(self.hostname) && !has(self.port)
                    && !has(self.useSsl) && !has(self.tokenSecretRef) : has(self.hostname)
                    && has(self.tokenSecretRef)'
              radarr:
                description: |-
                  radarr lists the Radarr servers Seerr sends movie requests to, matched by
                  name. Seerr uses the default server, and the default 4K server for 4K
                  requests.
                items:
                  description: SeerrServiceConnection defines a connection to a Sonarr
                    or Radarr instance.
                  properties:
                    activeAnimeDirectory:
                      description: |-
                        activeAnimeDirectory is the root folder for anime. Only applicable when
                        used with Sonarr.
                      minLength: 1
                      type: string
                    activeAnimeProfileName:
                      description: |-
                        activeAnimeProfileName is the quality profile for anime, resolved against
                        the server on each reconciliation. Only applicable when used with Sonarr.
                      minLength: 1
                      type: string
                    activeDirectory:
                      description: activeDirectory is the root folder path for media.
                      minLength: 1
                      type: string
                    activeProfileId:
                      description: activeProfileId is used when activeProfileName
                        is omitted.
                      format: int32
                      type: integer
                    activeProfileName:
                      description: |-
                        activeProfileName is resolved against the service on each reconciliation.
                        When set, it takes precedence over activeProfileId; exactly one match is required.
                      minLength: 1
                      type: string
                    animeSeriesType:
                      description: |-
                        animeSeriesType is the series type for anime. Only applicable when used
                        with Sonarr.
                      enum:
                      - standard
                      - daily
                      - anime
                      type: string
                    apiKeySecretRef:
                      description: apiKeySecretRef references a Secret containing
                        the service API key.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          minLength: 1
                          type: string
                        name:
                          description: name is the name of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    appRef:
                      description: |-
                        appRef names the server's resource, a Sonarr in sonarr or a Radarr in
                        radarr, whose connection is used in place of hostname, port, useSsl,
                        baseUrl and apiKeySecretRef.
                      properties:
                        group:
                          default: arrchitect.dev
                          description: group is the resource's API group.
                          enum:
                          - arrchitect.dev
                          type: string
                        kind:
                          description: kind is the resource's kind, such as Sonarr.
                          enum:
                          - Sonarr
                          - Radarr
                          - Lidarr
                          - Readarr
                          - Prowlarr
                          - Seerr
                          - Jellyfin
                          - Plex
                          - QBittorrent
                          - Sabnzbd
                          type: string
                        name:
                          description: name is the resource's name.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    baseUrl:
                      description: baseUrl is the URL base path for the service.
                      minLength: 1
                      type: string
                    enableSeasonFolders:
                      description: |-
                        enableSeasonFolders enables season folder organization in Sonarr.
                        Only applicable when used with Sonarr.
                      type: boolean
                    externalUrl:
                      description: externalUrl is the address users open the server
                        at, for links in Seerr.
                      minLength: 1
                      type: string
                    hostname:
                      description: hostname is the service hostname.
                      minLength: 1
                      type: string
                    is4k:
                      description: is4k indicates this is a 4K instance.
                      type: boolean
                    isDefault:
                      description: isDefault indicates this is the default service
                        for its type.
                      type: boolean
                    minimumAvailability:
                      description: |-
                        minimumAvailability is the minimum availability for Radarr.
                        Only applicable when used with Radarr.
                      enum:
                      - announced
                      - inCinemas
                      - released
                      type: string
                    monitorNewItems:
                      description: |-
                        monitorNewItems decides whether seasons added to a series later are
                        monitored. Only applicable when used with Sonarr.
                      enum:
                      - all
                      - none
                      type: string
                    name:
                      description: name is the display name for this service connection.
                      minLength: 1
                      type: string
                    port:
                      description: port is the service port.
                      format: int32
                      type: integer
                    preventSearch:
                      description: preventSearch stops the server from searching as
                        soon as a request is approved.
                      type: boolean
                    seriesType:
                      description: |-
                        seriesType is the series type for Sonarr (e.g., "standard", "anime").
                        Only applicable when used with Sonarr.
                      minLength: 1
                      type: string
                    syncEnabled:
                      description: syncEnabled scans the server for media and request
                        status.
                      type: boolean
                    tagRequests:
                      description: tagRequests tags each request with the requesting
                        user.
                      type: boolean
                    useSsl:
                      description: useSsl enables SSL for the service connection.
                      type: boolean
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: set appRef, or hostname, port and apiKeySecretRef, not
                      both
                    rule: 'has(self.appRef) ? !has(self.hostname) && !has(self.port)
                      && !has(self.useSsl) && !has(self.baseUrl) && !has(self.apiKeySecretRef)
                      : has(self.hostname) && has(self.port) && has(self.apiKeySecretRef)'
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: a radarr server refers to a Radarr
                  rule: self.all(s, !has(s.appRef) || s.appRef.kind == 'Radarr')
              reconcile:
                description: reconcile configures reconciliation behavior (e.g., sync
                  interval).
                properties:
                  deletionPolicy:
                    description: |-
                      deletionPolicy controls what happens to resources in the app when this CR
                      is deleted. "orphan" leaves them in place, "delete" removes the resources
                      the operator created.
                      Default: orphan.
                    enum:
                    - orphan
                    - delete
                    type: string
                  driftPolicy:
                    description: |-
                      driftPolicy controls whether drift is corrected or only recorded.
                      "enforce" rewrites a resource whose live state differs from this CR.
                      "observe" leaves the app untouched and only counts the difference, which
                      makes drift measurable before handing the operator write authority.
                      Default: enforce.
                    enum:
                    - enforce
                    - observe
                    type: string
                  intervalSeconds:
                    description: |-
                      intervalSeconds is how often the operator reconciles, in seconds.
                      Defaults to 300, and is at least 30.
                    format: int32
                    minimum: 30
                    type: integer
                  prune:
                    description: |-
                      prune deletes resources the operator created, tracked in
                      status.managedResources, once they are removed from this spec. Resources
                      it did not create are never deleted, and a resource type with nothing
                      declared is left alone. Root folders and tags are never pruned.
                      Not every integration supports prune; one that does not rejects it with
                      InvalidConfig rather than ignoring it.
                      Default: false (only create/update, never delete).
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: deletionPolicy delete conflicts with driftPolicy observe
                  rule: '!has(self.deletionPolicy) || self.deletionPolicy != ''delete''
                    || !has(self.driftPolicy) || self.driftPolicy != ''observe'''
              sonarr:
                description: |-
                  sonarr lists the Sonarr servers Seerr sends TV requests to, matched by

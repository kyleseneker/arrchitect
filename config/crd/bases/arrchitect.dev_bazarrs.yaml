---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: bazarrs.arrchitect.dev
spec:
  group: arrchitect.dev
  names:
    categories:
    - arrchitect
    kind: Bazarr
    listKind: BazarrList
    plural: bazarrs
    singular: bazarr
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Bazarr configures a Bazarr instance the operator connects to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of the Bazarr.
            properties:
              connection:
                description: connection defines how to connect to the Bazarr instance.
                properties:
                  apiKeySecretRef:
                    description: apiKeySecretRef references a Secret containing the
                      API key.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tls:
                    description: |-
                      tls configures TLS settings for the connection.
                      Only needed when the app uses HTTPS with self-signed or private CA certificates.
                    properties:
                      caSecretRef:
                        description: |-
                          caSecretRef references a Secret containing a PEM-encoded CA certificate bundle
                          used to verify the target app's TLS certificate.
                          The Secret must contain the CA certificate under the specified key.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            minLength: 1
                            type: string
                          name:
                            description: name is the name of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      insecureSkipVerify:
                        description: |-
                          insecureSkipVerify disables TLS certificate verification.
                          WARNING: This makes the connection susceptible to machine-in-the-middle attacks.
                          Only use for testing or when the target app uses a self-signed certificate and
                          providing a CA is not practical.
                        type: boolean
                    type: object
                  url:
                    description: url is the base URL of the app (e.g., http://sonarr.media.svc.cluster.local:8989).
                    minLength: 1
                    pattern: ^https?://
                    type: string
                required:
                - apiKeySecretRef
                - url
                type: object
              general:
                description: general configures general Bazarr settings.
                properties:
                  adaptiveSearching:
                    description: adaptiveSearching enables adaptive searching for
                      subtitles.
                    type: boolean
                  adaptiveSearchingDelay:
                    description: |-
                      adaptiveSearchingDelay is how long after the first search adaptiveSearching
                      starts searching less often.
                    enum:
                    - 1w
                    - 2w
                    - 3w
                    - 4w
                    type: string
                  adaptiveSearchingDelta:
                    description: |-
                      adaptiveSearchingDelta is how often adaptiveSearching searches once it
                      searches less often.
                    enum:
                    - 3d
                    - 1w
                    - 2w
                    - 3w
                    - 4w
                    type: string
                  chmod:
                    description: chmod is the octal permissions chmodEnabled sets
                      on subtitle files, such as 0640.
                    minLength: 1
                    pattern: ^0?[0-7]{3}$
                    type: string
                  chmodEnabled:
                    description: chmodEnabled enables setting file permissions on
                      subtitle files.
                    type: boolean
                  daysToUpgradeSubs:
                    description: daysToUpgradeSubs is how many days back Bazarr looks
                      for subtitles to upgrade.
                    format: int32
                    maximum: 30
                    minimum: 0
                    type: integer
                  embeddedSubtitlesParser:
                    description: embeddedSubtitlesParser is the parser used for embedded
                      subtitles.
                    enum:
                    - ffprobe
                    - mediainfo
                    type: string
                  hiExtension:
                    description: hiExtension is the file extension used for hearing-impaired
                      subtitle files.
                    enum:
                    - hi
                    - cc
                    - sdh
                    type: string
                  ignoreAssSubs:
                    description: ignoreAssSubs ignores ASS/SSA subtitles.
                    type: boolean
                  ignorePgsSubs:
                    description: ignorePgsSubs ignores PGS (image-based) subtitles.
                    type: boolean
                  ignoreVobsubSubs:
                    description: ignoreVobsubSubs ignores VobSub (image-based) subtitles.
                    type: boolean
                  minimumScore:
                    description: minimumScore is the minimum subtitle match score
                      for series.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  minimumScoreMovie:
                    description: minimumScoreMovie is the minimum subtitle match score
                      for movies.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  movieDefaultProfile:
                    description: |-
                      movieDefaultProfile is the language profile, by name, that new movies
                      get. Setting it turns the default on.
                    minLength: 1
                    type: string
                  movieTagEnabled:
                    description: |-
                      movieTagEnabled gives a movie the language profile whose tag matches one
                      of its Radarr tags.
                    type: boolean
                  multithreading:
                    description: multithreading enables multithreaded subtitle downloading.
                    type: boolean
                  pathMappings:
                    description: |-
                      pathMappings translate Sonarr's paths into the paths Bazarr sees the same
                      files at. Bazarr separates the two with a comma, so neither may have one.
                    items:
                      description: |-
                        BazarrPathMapping translates a path Sonarr or Radarr reports into the path
                        Bazarr reads the same file at.
                      properties:
                        localPath:
                          description: localPath is the path inside the Bazarr container.
                          minLength: 1
                          pattern: ^[^,]+$
                          type: string
                        remotePath:
                          description: remotePath is the path as Sonarr or Radarr
                            reports it.
                          minLength: 1
                          pattern: ^[^,]+$
                          type: string
                      required:
                      - localPath
                      - remotePath
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - remotePath
                    x-kubernetes-list-type: map
                  pathMappingsMovie:
                    description: |-
                      pathMappingsMovie translate Radarr's paths into the paths Bazarr sees the
                      same files at.
                    items:
                      description: |-
                        BazarrPathMapping translates a path Sonarr or Radarr reports into the path
                        Bazarr reads the same file at.
                      properties:
                        localPath:
                          description: localPath is the path inside the Bazarr container.
                          minLength: 1
                          pattern: ^[^,]+$
                          type: string
                        remotePath:
                          description: remotePath is the path as Sonarr or Radarr
                            reports it.
                          minLength: 1
                          pattern: ^[^,]+$
                          type: string
                      required:
                      - localPath
                      - remotePath
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - remotePath
                    x-kubernetes-list-type: map
                  postprocessingCmd:
                    description: |-
                      postprocessingCmd is the command usePostprocessing runs after a subtitle
                      is downloaded.
                    minLength: 1
                    type: string
                  postprocessingThreshold:
                    description: |-
                      postprocessingThreshold is the episode subtitle score, in percent, below
                      which postprocessingCmd runs.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  postprocessingThresholdMovie:
                    description: |-
                      postprocessingThresholdMovie is the movie subtitle score, in percent,
                      below which postprocessingCmd runs.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  removeProfileTags:
                    description: |-
                      removeProfileTags lists Sonarr and Radarr tags that take a series' or
                      movie's language profile away when seriesTagEnabled or movieTagEnabled is on.
                    items:
                      maxLength: 64
                      pattern: ^[a-z0-9_-]+$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  seriesDefaultProfile:
                    description: |-
                      seriesDefaultProfile is the language profile, by name, that new series
                      get. Setting it turns the default on.
                    minLength: 1
                    type: string
                  seriesTagEnabled:
                    description: |-
                      seriesTagEnabled gives a series the language profile whose tag matches
                      one of its Sonarr tags.
                    type: boolean
                  subfolder:
                    description: |-
                      subfolder is where subtitles are saved: next to the media file, in a
                      folder relative to it, or in an absolute folder.
                    enum:
                    - current
                    - relative
                    - absolute
                    type: string
                  subfolderCustom:
                    description: subfolderCustom is the folder subfolder relative
                      or absolute saves to.
                    minLength: 1
                    type: string
                  upgradeFrequency:
                    description: |-
                      upgradeFrequency is how often, in hours, Bazarr looks for better
                      subtitles. 876000, a hundred years, is how Bazarr turns it off.
                    enum:
                    - 6
                    - 12
                    - 24
                    - 168
                    - 876000
                    format: int32
                    type: integer
                  upgradeManual:
                    description: upgradeManual also upgrades subtitles that were downloaded
                      or translated by hand.
                    type: boolean
                  upgradeSubs:
                    description: upgradeSubs enables automatic subtitle upgrades when
                      better ones are found.
                    type: boolean
                  useEmbeddedSubs:
                    description: useEmbeddedSubs counts subtitles embedded in the
                      media file as present.
                    type: boolean
                  usePostprocessing:
                    description: usePostprocessing enables post-processing of downloaded
                      subtitles.
                    type: boolean
                  usePostprocessingThreshold:
                    description: |-
                      usePostprocessingThreshold runs postprocessingCmd for an episode subtitle
                      only when its score is below postprocessingThreshold.
                    type: boolean
                  usePostprocessingThresholdMovie:
                    description: |-
                      usePostprocessingThresholdMovie runs postprocessingCmd for a movie
                      subtitle only when its score is below postprocessingThresholdMovie.
                    type: boolean
                  useRadarr:
                    description: useRadarr enables the Radarr integration.
                    type: boolean
                  useScenename:
                    description: useScenename uses scene names for subtitle searching.
                    type: boolean
                  useSonarr:
                    description: useSonarr enables the Sonarr integration.
                    type: boolean
                  utf8Encode:
                    description: utf8Encode encodes subtitles to UTF-8.
                    type: boolean
                  wantedSearchFrequency:
                    description: |-
                      wantedSearchFrequency is how often, in hours, Bazarr searches for missing
                      episode subtitles. 876000, a hundred years, is how Bazarr turns it off.
                    enum:
                    - 6
                    - 12
                    - 24
                    - 168
                    - 876000
                    format: int32
                    type: integer
                  wantedSearchFrequencyMovie:
                    description: |-
                      wantedSearchFrequencyMovie is how often, in hours, Bazarr searches for
                      missing movie subtitles. 876000, a hundred years, is how Bazarr turns it off.
                    enum:
                    - 6
                    - 12
                    - 24
                    - 168
                    - 876000
                    format: int32
                    type: integer
                type: object
              jellyfin:
                description: |-
                  jellyfin has Bazarr refresh a movie or episode in Jellyfin after its
                  subtitles change, so they show without waiting for a library scan.
                  Setting it turns Bazarr's Jellyfin integration on. Needs Bazarr 1.6.0 or
                  later.
                properties:
                  apiKeySecretRef:
                    description: apiKeySecretRef references a Secret containing a
                      Jellyfin API key.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  appRef:
                    description: |-
                      appRef names the Jellyfin resource whose connection URL and API key are
                      used in place of url and apiKeySecretRef. That resource must set its
                      connection's apiKeySecretRef.
                    properties:
                      group:
                        default: arrchitect.dev
                        description: group is the resource's API group.
                        enum:
                        - arrchitect.dev
                        type: string
                      kind:
                        description: kind is the resource's kind, such as Sonarr.
                        enum:
                        - Sonarr
                        - Radarr
                        - Lidarr
                        - Readarr
                        - Prowlarr
                        - Seerr
                        - Jellyfin
                        - Plex
                        - QBittorrent
                        - Sabnzbd
                        type: string
                      name:
                        description: name is the resource's name.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: jellyfin refers to a Jellyfin
                      rule: self.kind == 'Jellyfin'
                  movieLibraries:
                    description: |-
                      movieLibraries names the Jellyfin movie libraries Bazarr finds a movie
                      in, and turns on refreshing a movie whose subtitles change. Left out,
                      Bazarr keeps its movie library settings.
                    items:
                      minLength: 1
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  refreshMethod:
                    description: |-
                      refreshMethod is how Bazarr tells Jellyfin: immediate refreshes the item
                      at once, and async reports the changed file for Jellyfin to pick up with
                      other changes.
                    enum:
                    - immediate
                    - async
                    type: string
                  seriesLibraries:
                    description: |-
                      seriesLibraries names the Jellyfin TV libraries Bazarr finds a series in,
                      and turns on refreshing an episode whose subtitles change. Left out,
                      Bazarr keeps its series library settings.
                    items:
                      minLength: 1
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  url:
                    description: url is the Jellyfin URL as Bazarr reaches it (e.g.,
                      http://jellyfin.media.svc.cluster.local:8096).
                    minLength: 1
                    pattern: ^https?://
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set appRef, or url and apiKeySecretRef, not both
                  rule: 'has(self.appRef) ? !has(self.url) && !has(self.apiKeySecretRef)
                    : has(self.url) && has(self.apiKeySecretRef)'
              languages:
                description: languages configures language settings and profiles.
                properties:
                  enabled:
                    description: enabled is the list of enabled subtitle languages
                      as ISO 639-1 codes.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  profiles:
                    description: profiles defines language profiles for subtitle selection.
                    items:
                      description: BazarrLanguageProfile defines a language profile
                        for subtitle selection.
                      properties:
                        cutoff:
                          description: |-
                            cutoff is the item whose subtitle ends the search for the others, named
                            as Bazarr shows it: the language code, with :hi or :forced for such an
                            item, such as en or en:hi. any ends it at whichever item is found first,
                            and none searches for every item.
                          maxLength: 32
                          minLength: 1
                          type: string
                        items:
                          description: items defines the language items in this profile.
                          items:
                            description: BazarrLanguageItem defines a language entry
                              within a language profile.
                            properties:
                              audioExclude:
                                description: audioExclude excludes this language if
                                  audio already matches.
                                type: boolean
                              audioOnlyInclude:
                                description: |-
                                  audioOnlyInclude wants this language only when the media has an audio
                                  track in it.
                                type: boolean
                              forced:
                                description: forced indicates whether forced subtitles
                                  are preferred.
                                type: boolean
                              hi:
                                description: hi indicates whether hearing-impaired
                                  subtitles are preferred.
                                type: boolean
                              language:
                                description: language is the ISO 639-1 language code.
                                minLength: 1
                                type: string
                            required:
                            - language
                            type: object
                            x-kubernetes-validations:
                            - message: audioExclude and audioOnlyInclude can't both
                                be true
                              rule: '!(has(self.audioExclude) && self.audioExclude
                                && has(self.audioOnlyInclude) && self.audioOnlyInclude)'
                          type: array
                          x-kubernetes-list-type: atomic
                        mustContain:
                          description: |-
                            mustContain lists words or regular expressions one of which a
                            subtitle's release information must contain.
                          items:
                            minLength: 1
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        mustNotContain:
                          description: |-
                            mustNotContain lists words or regular expressions that rule out a
                            subtitle whose release information contains one, ignoring case.
                          items:
                            minLength: 1
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        name:
                          description: name is the display name of the language profile.
                          minLength: 1
                          type: string
                        originalFormat:
                          description: |-
                            originalFormat keeps downloaded subtitles in their own format instead
                            of converting them.
                          type: boolean
                        profileId:
                          description: profileId is the unique identifier for this
                            profile.
                          format: int32
                          type: integer
                        tag:
                          description: |-
                            tag is the Sonarr or Radarr tag that gives a series or movie this
                            profile when general.seriesTagEnabled or movieTagEnabled is on.
                          maxLength: 64
                          minLength: 1
                          pattern: ^[a-z0-9_-]+$
                          type: string
                      required:
                      - name
                      - profileId
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              notifications:
                description: |-
                  notifications sets up Bazarr's notification providers, matched by name.
                  Bazarr lists every provider Apprise supports, and one left out keeps its
                  settings.
                items:
                  description: BazarrNotification sets up one of Bazarr's notification
                    providers.
                  minProperties: 2
                  properties:
                    enabled:
                      description: enabled turns the provider on.
                      type: boolean
                    name:
                      description: name is the provider, as Bazarr lists it, such
                        as Discord or Telegram.
                      minLength: 1
                      type: string
                    urlSecretRef:
                      description: |-
                        urlSecretRef is the Secret key holding the provider's Apprise URL, such
                        as discord://webhook_id/webhook_token.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          minLength: 1
                          type: string
                        name:
                          description: name is the name of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              providers:
                description: providers defines subtitle provider configurations.
                items:
                  description: BazarrProvider defines a subtitle provider configuration.
                  properties:
                    enabled:
                      description: enabled controls whether this provider is active.
                      type: boolean
                    name:
                      description: name is the provider key (e.g., opensubtitlescom,
                        addic7ed).
                      minLength: 1
                      type: string
                    settings:
                      description: |-
                        settings are the provider's settings, each a text value or read from a
                        Secret in the resource's namespace, such as a password or API key.
                      items:
                        description: |-
                          ConfigField is a named field of a provider's configuration. It sets value
                          or valueFrom, not both.
                        maxProperties: 2
                        properties:
                          name:
                            description: name is the field name.
                            minLength: 1
                            type: string
                          value:
                            description: 'value is the field value: a string, number,
                              boolean or list.'
                            x-kubernetes-preserve-unknown-fields: true
                          valueFrom:
                            description: valueFrom reads the field value from a source.
                            properties:
                              secretKeyRef:
                                description: secretKeyRef reads the value from a key
                                  of a Secret in the resource's namespace.
                                properties:
                                  key:
                                    description: key is the key within the Secret.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: name is the name of the Secret.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - secretKeyRef
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              radarrConnection:
                description: radarrConnection configures the connection to a Radarr
                  instance.
                minProperties: 1
                properties:
                  apiKeySecretRef:
                    description: apiKeySecretRef references a Secret containing the
                      application's API key.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  appRef:
                    description: |-
                      appRef names the application's resource, whose connection is used in
                      place of host, port, basePath, ssl and apiKeySecretRef.
                    properties:
                      group:
                        default: arrchitect.dev
                        description: group is the resource's API group.
                        enum:
                        - arrchitect.dev
                        type: string
                      kind:
                        description: kind is the resource's kind, such as Sonarr.
                        enum:
                        - Sonarr
                        - Radarr
                        - Lidarr
                        - Readarr
                        - Prowlarr
                        - Seerr
                        - Jellyfin
                        - Plex
                        - QBittorrent
                        - Sabnzbd
                        type: string
                      name:
                        description: name is the resource's name.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  basePath:
                    description: basePath is the URL base path of the application.
                    minLength: 1
                    type: string
                  excludeSeasonZero:
                    description: excludeSeasonZero leaves out specials. Only applicable
                      when used with Sonarr.
                    type: boolean
                  excludedSeriesTypes:
                    description: |-
                      excludedSeriesTypes leaves out series of these types. Only applicable
                      when used with Sonarr.
                    items:
                      enum:
                      - standard
                      - anime
                      - daily
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  excludedTags:
                    description: excludedTags leaves out items with any of these tags.
                    items:
                      maxLength: 64
                      pattern: ^[a-z0-9_-]+$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  fullUpdate:
                    description: fullUpdate controls how often a full library sync
                      is performed.
                    enum:
                    - Daily
                    - Weekly
                    - Manually
                    type: string
                  host:
                    description: host is the hostname or IP of the application.
                    minLength: 1
                    type: string
                  httpTimeout:
                    description: httpTimeout is the HTTP request timeout in seconds.
                    enum:
                    - 60
                    - 120
                    - 180
                    - 240
                    - 300
                    - 600
                    format: int32
                    type: integer
                  onlyMonitored:
                    description: onlyMonitored limits subtitle searches to monitored
                      items only.
                    type: boolean
                  port:
                    description: port is the port of the application.
                    format: int32
                    type: integer
                  ssl:
                    description: ssl enables HTTPS connections to the application.
                    type: boolean
                  syncInterval:
                    description: syncInterval is how often, in minutes, Bazarr syncs
                      the library.
                    enum:
                    - 15
                    - 60
                    - 180
                    - 360
                    - 720
                    - 1440
                    - 10080
                    format: int32
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: radarrConnection refers to a Radarr
                  rule: '!has(self.appRef) || self.appRef.kind == ''Radarr'''
                - message: set appRef, or host, port and apiKeySecretRef, not both
                  rule: 'has(self.appRef) ? !has(self.host) && !has(self.port) &&
                    !has(self.basePath) && !has(self.ssl) && !has(self.apiKeySecretRef)
                    : has(self.host) && has(self.port) && has(self.apiKeySecretRef)'
              reconcile:
                description: reconcile configures reconciliation behavior (e.g., sync
                  interval).
                properties:
                  deletionPolicy:
                    description: |-
                      deletionPolicy controls what happens to resources in the app when this CR
                      is deleted. "orphan" leaves them in place, "delete" removes the resources
                      the operator created.
                      Default: orphan.
                    enum:
                    - orphan
                    - delete
                    type: string
                  driftPolicy:
                    description: |-
                      driftPolicy controls whether drift is corrected or only recorded.
                      "enforce" rewrites a resource whose live state differs from this CR.
                      "observe" leaves the app untouched and only counts the difference, which
                      makes drift measurable before handing the operator write authority.
                      Default: enforce.
                    enum:
                    - enforce
                    - observe
                    type: string
                  intervalSeconds:
                    description: |-
                      intervalSeconds is how often the operator reconciles, in seconds.
                      Defaults to 300, and is at least 30.
                    format: int32
                    minimum: 30

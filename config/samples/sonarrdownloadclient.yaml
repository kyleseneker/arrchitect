apiVersion: arrchitect.dev/v1alpha1
kind: SonarrDownloadClient
metadata:
  name: sonarr-qbittorrent
spec:
  sonarrRef:
    name: sonarr
  name: qBittorrent
  protocol: torrent
  implementation: QBittorrent
  host: arr-vpn-downloads.arr.svc.cluster.local
  port: 8080
  category: tv
  usernameSecretRef:
    name: arr-config-secrets
    key: QBITTORRENT_USERNAME
  passwordSecretRef:
    name: arr-config-secrets
    key: QBITTORRENT_PASSWORD

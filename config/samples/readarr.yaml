apiVersion: arrchitect.dev/v1alpha1
kind: Readarr
metadata:
  name: readarr
spec:
  connection:
    url: http://readarr.media.svc.cluster.local:8787
    apiKeySecretRef:
      name: readarr-credentials
      key: api-key
  mediaManagement:
    copyUsingHardlinks: true
    deleteEmptyFolders: true
    rescanAfterRefresh: always
  naming:
    renameBooks: true
    replaceIllegalCharacters: true
    standardBookFormat: "{Author Name} - {Book Title}"
    authorFolderFormat: "{Author Name}"
  downloadClientConfig:
    enableCompletedDownloadHandling: true
    autoRedownloadFailed: true
    autoRedownloadFailedFromInteractiveSearch: true
  rootFolders:
    - path: /data/media/books
      defaultQualityProfileName: eBook
      defaultMetadataProfileName: Standard
  tags:
    - label: audiobook
  notifications:
    - name: Discord
      implementation: Discord
      onGrab: true
      onReleaseImport: true
      onUpgrade: true
      onHealthIssue: true
      includeHealthWarnings: true
      fields:
        - name: webHookUrl
          valueFrom:
            secretKeyRef:
              name: discord-credentials
              key: webhook-url

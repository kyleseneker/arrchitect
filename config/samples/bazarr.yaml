apiVersion: arrchitect.dev/v1alpha1
kind: Bazarr
metadata:
  name: bazarr
spec:
  connection:
    url: http://bazarr.media.svc.cluster.local:6767
    apiKeySecretRef:
      name: bazarr-credentials
      key: api-key
  general:
    useSonarr: true
    useRadarr: true
    minimumScore: 90
    minimumScoreMovie: 70
    useScenename: true
    multithreading: true
    utf8Encode: true
    embeddedSubtitlesParser: ffprobe
    hiExtension: hi
    upgradeFrequency: 12
    wantedSearchFrequency: 12
    seriesDefaultProfile: English
    movieDefaultProfile: English
    pathMappings:
      - remotePath: /data/media/tv
        localPath: /tv
    pathMappingsMovie:
      - remotePath: /data/media/movies
        localPath: /movies
  sonarrConnection:
    host: sonarr.media.svc.cluster.local
    port: 8989
    apiKeySecretRef:
      name: sonarr-credentials
      key: api-key
    httpTimeout: 300
    fullUpdate: Daily
    syncInterval: 60
  radarrConnection:
    host: radarr.media.svc.cluster.local
    port: 7878
    apiKeySecretRef:
      name: radarr-credentials
      key: api-key
    httpTimeout: 300
    fullUpdate: Daily
    syncInterval: 60
  jellyfin:
    url: http://jellyfin.media.svc.cluster.local:8096
    apiKeySecretRef:
      name: jellyfin-credentials
      key: api-key
    movieLibraries:
      - Movies
    seriesLibraries:
      - TV Shows
  subSync:
    useSubsync: false
    subsyncThreshold: 90
    subsyncMovieThreshold: 70
  providers:
    - name: opensubtitlescom
      enabled: true
      settings:
        - name: use_hash
          value: "true"
        - name: username
          valueFrom:
            secretKeyRef:
              name: opensubtitles-credentials
              key: username
        - name: password
          valueFrom:
            secretKeyRef:
              name: opensubtitles-credentials
              key: password
    - name: podnapisi
      enabled: true
    - name: supersubtitles
      enabled: true
  languages:
    enabled:
      - en
    profiles:
      - profileId: 1
        name: English
        items:
          - language: en
            hi: false
            forced: false
            audioExclude: false

apiVersion: arrchitect.dev/v1alpha1
kind: Sabnzbd
metadata:
  name: sabnzbd
spec:
  connection:
    url: http://sabnzbd.media.svc.cluster.local:8080
    apiKeySecretRef:
      name: sabnzbd-credentials
      key: api-key
  general:
    preCheck: true
    failHopelessJobs: true
    encryptedRarAction: fail
    unwantedExtensions:
      - exe
      - lnk
    unwantedExtensionsAction: fail
    deobfuscateFinalFilenames: true
    historyRetention: days-delete
    historyRetentionNumber: 30
    permissions: "775"
  folders:
    completeDir: /data/usenet/complete
    incompleteDir: /data/usenet/incomplete
  servers:
    - name: Primary
      host: news.example.com
      port: 563
      ssl: true
      connections: 20
      usernameSecretRef:
        name: usenet-credentials
        key: username
      passwordSecretRef:
        name: usenet-credentials
        key: password
  categories:
    - name: tv
      dir: tv
    - name: movies
      dir: movies
    - name: music
      dir: music
    - name: books
      dir: books

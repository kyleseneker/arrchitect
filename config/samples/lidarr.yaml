apiVersion: arrchitect.dev/v1alpha1
kind: Lidarr
metadata:
  name: lidarr
spec:
  connection:
    url: http://lidarr.media.svc.cluster.local:8686
    apiKeySecretRef:
      name: lidarr-credentials
      key: api-key
  mediaManagement:
    copyUsingHardlinks: true
    deleteEmptyFolders: true
    rescanAfterRefresh: always
  naming:
    renameTracks: true
    replaceIllegalCharacters: true
    standardTrackFormat: "{Artist Name} - {Album Title} - {track:00} - {Track Title}"
    artistFolderFormat: "{Artist Name}"
  downloadClientConfig:
    enableCompletedDownloadHandling: true
    autoRedownloadFailed: true
    autoRedownloadFailedFromInteractiveSearch: true
  ui:
    firstDayOfWeek: 0
    shortDateFormat: MMM D YYYY
    longDateFormat: dddd, MMMM D YYYY
    timeFormat: h(:mm)a
    showRelativeDates: true
    theme: auto
    uiLanguage: 1
  rootFolders:
    - path: /data/media/music
      defaultQualityProfileName: Any
      defaultMetadataProfileName: Standard
  tags:
    - label: lossless
  notifications:
    - name: Discord
      implementation: Discord
      onGrab: true
      onReleaseImport: true
      onUpgrade: true
      onHealthIssue: true
      includeHealthWarnings: true
      fields:
        - name: webHookUrl
          valueFrom:
            secretKeyRef:
              name: discord-credentials
              key: webhook-url

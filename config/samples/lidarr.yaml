apiVersion: arrchitect.dev/v1alpha1
kind: Lidarr
metadata:
  name: lidarr
spec:
  connection:
    url: http://lidarr.media.svc.cluster.local:8686
    apiKeySecretRef:
      name: lidarr-credentials
      key: api-key
  mediaManagement:
    copyUsingHardlinks: true
    deleteEmptyFolders: true
    rescanAfterRefresh: always
  naming:
    renameTracks: true
    replaceIllegalCharacters: true
    standardTrackFormat: "{Artist Name} - {Album Title} - {track:00} - {Track Title}"
    artistFolderFormat: "{Artist Name}"
  rootFolders:
    - path: /data/media/music
      defaultQualityProfileName: Any
      defaultMetadataProfileName: Standard

apiVersion: arrchitect.dev/v1alpha1
kind: SonarrIndexer
metadata:
  name: sonarr-usenet-indexer
spec:
  sonarrRef:
    name: sonarr
  name: Usenet Indexer
  protocol: usenet
  implementation: Newznab
  enableRss: true
  enableAutomaticSearch: true
  enableInteractiveSearch: true
  fields:
    - name: baseUrl
      value: https://indexer.example.com
    - name: apiPath
      value: /api
    - name: apiKey
      valueFrom:
        secretKeyRef:
          name: usenet-indexer-credentials
          key: api-key
    - name: categories
      value: [5000, 5040, 5045]

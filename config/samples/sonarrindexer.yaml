apiVersion: arrchitect.dev/v1alpha1
kind: SonarrIndexer
metadata:
  name: sonarr-nzbgeek
spec:
  sonarrRef:
    name: sonarr
  name: NZBgeek
  protocol: usenet
  implementation: Newznab
  enableRss: true
  enableAutomaticSearch: true
  enableInteractiveSearch: true
  fields:
    - name: baseUrl
      value: "https://api.nzbgeek.info"
    - name: apiPath
      value: "/api"
    - name: apiKey
      valueFrom:
        secretKeyRef:
          name: nzbgeek-credentials
          key: api-key
    - name: categories
      value: "5000,5040,5045"

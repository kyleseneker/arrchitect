apiVersion: arrchitect.dev/v1alpha1
kind: Seerr
metadata:
  name: seerr
spec:
  connection:
    url: http://seerr.media.svc.cluster.local:5055
  jellyfinAuth:
    hostname: jellyfin.media.svc.cluster.local
    port: 8096
    useSsl: false
    usernameSecretRef:
      name: jellyfin-credentials
      key: username
    passwordSecretRef:
      name: jellyfin-credentials
      key: password
  main:
    applicationTitle: Seerr
    localLogin: true
    mediaServerLogin: true
    defaultPermissions: 32
    partialRequestsEnabled: true
    locale: en
  sonarr:
    - name: Sonarr
      hostname: sonarr.media.svc.cluster.local
      port: 8989
      apiKeySecretRef:
        name: sonarr-credentials
        key: api-key
      activeProfileName: WEB-1080p
      activeDirectory: /data/media/tv
      isDefault: true
      enableSeasonFolders: true
      seriesType: standard
  radarr:
    - name: Radarr
      hostname: radarr.media.svc.cluster.local
      port: 7878
      apiKeySecretRef:
        name: radarr-credentials
        key: api-key
      activeProfileName: HD Bluray + WEB
      activeDirectory: /data/media/movies
      isDefault: true
      minimumAvailability: released
  notifications:
    - agent: discord
      enabled: true
      types: [mediaPending, mediaApproved, mediaAvailable, mediaFailed, mediaDeclined]
      options:
        - name: botUsername
          value: "Seerr"
        - name: enableMentions
          value: false
        - name: webhookUrl
          valueFrom:
            secretKeyRef:
              name: discord-credentials
              key: webhook-url
    - agent: telegram
      enabled: true
      types: [mediaPending, mediaApproved, mediaAvailable, mediaFailed, mediaDeclined]
      options:
        - name: chatId
          value: "your-chat-id"
        - name: botAPI
          valueFrom:
            secretKeyRef:
              name: telegram-credentials
              key: bot-token

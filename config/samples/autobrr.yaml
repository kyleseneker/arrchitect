apiVersion: arrchitect.dev/v1alpha1
kind: Autobrr
metadata:
  name: autobrr
spec:
  connection:
    url: http://autobrr.media.svc.cluster.local:7474
    apiKeySecretRef:
      name: autobrr-credentials
      key: api-key
  downloadClients:
    - name: qBittorrent
      type: qBittorrent
      host: qbittorrent.media.svc.cluster.local
      port: 8080
      usernameSecretRef:
        name: qbittorrent-credentials
        key: username
      passwordSecretRef:
        name: qbittorrent-credentials
        key: password
  indexers:
    - name: Prowlarr
      identifier: torznab
  feeds:
    - name: Prowlarr
      type: Torznab
      url: http://prowlarr.media.svc.cluster.local:9696/1/api
      indexerName: Prowlarr
      interval: 15
      apiKeySecretRef:
        name: prowlarr-credentials
        key: api-key
  filters:
    - name: TV Shows - 1080p
      priority: 1
      indexers:
        - Prowlarr
      resolutions:
        - 1080p
      sources:
        - BluRay
        - WEB-DL
        - WEB
      smartEpisode: true
      maxDownloads: 10
      maxDownloadsUnit: DAY
      actions:
        - name: Send to qBittorrent
          type: qBittorrent
          downloadClientName: qBittorrent
          category: tv
          contentLayout: ORIGINAL
          limitSeedTime: 10080

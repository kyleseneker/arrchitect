apiVersion: arrchitect.dev/v1alpha1
kind: QBittorrent
metadata:
  name: qbittorrent
spec:
  connection:
    url: http://qbittorrent.media.svc.cluster.local:8080
    usernameSecretRef:
      name: qbittorrent-credentials
      key: username
    passwordSecretRef:
      name: qbittorrent-credentials
      key: password
  preferences:
    savePath: /data/torrents/
    dht: true
    pex: true
    lsd: true
    encryption: allow
    maxConnec: -1
    maxConnecPerTorrent: -1
    maxUploads: -1
    maxUploadsPerTorrent: -1
    locale: en
    webUiPort: 8080
    autoTmmEnabled: true
    torrentContentLayout: Original
    excludedFileNamesEnabled: true
    excludedFileNames:
      - "*.lnk"
      - "*.exe"
    queueingEnabled: false
    upnp: false
    networkInterface: tun0
  categories:
    - name: tv
      savePath: /data/torrents/tv
    - name: movies
      savePath: /data/torrents/movies

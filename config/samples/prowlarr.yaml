apiVersion: arrchitect.dev/v1alpha1
kind: Prowlarr
metadata:
  name: prowlarr
spec:
  connection:
    url: http://arr-prowlarr.arr.svc.cluster.local:9696
    apiKeySecretRef:
      name: prowlarr-credentials
      key: api-key
  proxies:
    - name: FlareSolverr
      implementation: FlareSolverr
      configContract: FlareSolverrSettings
      host: http://arr-flaresolverr.arr.svc.cluster.local:8191
      requestTimeout: 60
  applications:
    - name: Sonarr
      syncLevel: fullSync
      appRef:
        kind: Sonarr
        name: sonarr
      syncCategories: [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5090]
    - name: Radarr
      syncLevel: fullSync
      implementation: Radarr
      configContract: RadarrSettings
      prowlarrUrl: http://arr-prowlarr.arr.svc.cluster.local:9696
      baseUrl: http://arr-radarr.arr.svc.cluster.local:7878
      apiKeySecretRef:
        name: radarr-credentials
        key: api-key
      syncCategories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090]
  indexers:
    - name: Internet Archive
      implementation: Cardigann
      configContract: CardigannSettings
      enable: true
      appProfileName: Standard
      priority: 25
      fields:
        - name: definitionFile
          value: internetarchive
        - name: baseUrl
          value: "https://archive.org/"
    - name: Usenet Indexer
      implementation: Newznab
      configContract: NewznabSettings
      enable: true
      appProfileName: Standard
      priority: 25
      fields:
        - name: baseUrl
          value: "https://indexer.example.com"
        - name: apiPath
          value: /api
        - name: apiKey
          valueFrom:
            secretKeyRef:
              name: usenet-indexer-credentials
              key: api-key
  tags:
    - label: anime
    - label: hdr
  downloadClients:
    - name: qBittorrent
      protocol: torrent
      implementation: QBittorrent
      fields:
        - name: host
          value: "arr-vpn-downloads.arr.svc.cluster.local"
        - name: port
          value: 8080
      categories:
        - clientCategory: tv-sonarr
          categories: [5000, 5010, 5020, 5030, 5040, 5045, 5050]
        - clientCategory: radarr
          categories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060]
  notifications:
    - name: Discord
      implementation: Discord
      onHealthIssue: true
      onApplicationUpdate: true
      includeHealthWarnings: true
      fields:
        - name: webHookUrl
          value: "https://discord.com/api/webhooks/your-webhook-url"

apiVersion: arrchitect.dev/v1alpha1
kind: RadarrIndexer
metadata:
  name: radarr-nzbgeek
spec:
  radarrRef:
    name: radarr
  name: NZBgeek
  protocol: usenet
  implementation: Newznab
  enableRss: true
  enableAutomaticSearch: true
  enableInteractiveSearch: true
  fields:
    - name: baseUrl
      value: "https://api.nzbgeek.info"
    - name: apiPath
      value: "/api"
    - name: apiKey
      valueFrom:
        secretKeyRef:
          name: nzbgeek-credentials
          key: api-key
    - name: categories
      value: "2000,2040,2045"

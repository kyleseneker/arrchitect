apiVersion: arrchitect.dev/v1alpha1
kind: LidarrIndexer
metadata:
  name: lidarr-nzbgeek
spec:
  lidarrRef:
    name: lidarr
  name: NZBgeek
  protocol: usenet
  implementation: Newznab
  enableRss: true
  enableAutomaticSearch: true
  enableInteractiveSearch: true
  fields:
    - name: baseUrl
      value: "https://api.nzbgeek.info"
    - name: apiPath
      value: "/api"
    - name: apiKey
      valueFrom:
        secretKeyRef:
          name: arr-config-secrets
          key: NZBGEEK_API_KEY
    - name: categories
      value: "3000,3040"

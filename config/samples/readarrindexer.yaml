apiVersion: arrchitect.dev/v1alpha1
kind: ReadarrIndexer
metadata:
  name: readarr-usenet-indexer
spec:
  readarrRef:
    name: readarr
  name: Usenet Indexer
  protocol: usenet
  implementation: Newznab
  enableRss: true
  enableAutomaticSearch: true
  enableInteractiveSearch: true
  fields:
    - name: baseUrl
      value: https://indexer.example.com
    - name: apiPath
      value: /api
    - name: apiKey
      valueFrom:
        secretKeyRef:
          name: usenet-indexer-credentials
          key: api-key
    - name: categories
      value: [7000, 7020]

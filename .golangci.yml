version: "2"
run:
  allow-parallel-runners: true
  # Lint the opt-in compat suite too.
  build-tags:
    - compat
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck

    - goconst
    - gocyclo
    - govet
    - ineffassign
    - kubeapilinter
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    custom:
      kubeapilinter:
        type: module
        description: Kube API Linter lints Kube-like APIs against the API conventions.
        settings:
          linters:
            disable:
              # Not meant for CRDs, whose optionality OpenAPI validates.
              - nonpointerstructs
          lintersConfig:
            conditions:
              useProtobuf: Forbid
              usePatchStrategy: Forbid
            defaults:
              preferredDefaultMarker: kubebuilder:default
            optionalfields:
              pointers:
                preference: WhenRequired
    goconst:
      # goconst 1.10 began flagging composite literals (JSON payload keys) and tests.
      ignore-tests: true
      exclude-types:
        - Call
        - CompositeLit
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - kubeapilinter
        path-except: ^api/
      # kube-api-linter reads markers only in the package it lints, so it can't
      # see that the shared connection and reference types require their fields.
      - linters:
          - kubeapilinter
        text: 'requiredfields: field \w+\.(Connection|\w*Ref) has a valid zero value \(\{\}\)'
      # It also reads the shared status embedded inline as a field named "", so
      # it takes an empty status as valid and asks for a pointer or omitempty.
      - linters:
          - kubeapilinter
        text: 'optionalfields: field \w+\.Status (has a valid zero value \(\{"": \{\}\}\)|should have the omitempty tag)'

      - linters:
          - dupl
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # An error may start with an app's name, which is a proper noun.
      - linters:
          - staticcheck
        text: 'ST1005:'
        source: '"(Autobrr|Bazarr|FlareSolverr|Jellyfin|Lidarr|Maintainerr|Plex|Prowlarr|Radarr|Readarr|SABnzbd|Seerr|Sonarr|Tautulli|Tdarr) '
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

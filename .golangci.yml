version: "2"
run:
  allow-parallel-runners: true
  # Lint the opt-in compat suite too.
  build-tags:
    - compat
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck

    - goconst
    - gocyclo
    - govet
    - ineffassign
    - kubeapilinter
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    custom:
      kubeapilinter:
        type: module
        description: Kube API Linter lints Kube-like APIs against the API conventions.
        settings:
          linters: {}
          lintersConfig:
            conditions:
              useProtobuf: Forbid
              usePatchStrategy: Forbid
            defaults:
              preferredDefaultMarker: kubebuilder:default
            optionalfields:
              pointers:
                preference: WhenRequired
    goconst:
      # goconst 1.10 began flagging composite literals (JSON payload keys) and tests.
      ignore-tests: true
      exclude-types:
        - Call
        - CompositeLit
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - kubeapilinter
        path-except: api/*
      - linters:
          - dupl
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

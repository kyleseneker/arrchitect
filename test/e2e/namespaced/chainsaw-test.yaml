apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: namespaced
spec:
  description: >-
    Installs the chart the way a single-namespace setup runs it: one watched namespace, only some
    apps on, and the operator's namespace at the restricted Pod Security level.
  steps:
    - name: start Sonarr and Prowlarr
      try:
        - apply:
            file: ../resources/sonarr.yaml
        - apply:
            file: prowlarr.yaml
        - assert:
            file: ../resources/sonarr-ready.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: prowlarr
              status:
                availableReplicas: 1
    - name: install under restricted Pod Security
      try:
        - script:
            content: |
              kubectl create namespace arrchitect --dry-run=client -o yaml | kubectl apply -f -
              kubectl label namespace arrchitect --overwrite \
                pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/enforce-version=latest
              helm install arrchitect ../../../chart/arrchitect --namespace arrchitect -f values.yaml \
                --set watchNamespace="$NAMESPACE" --wait --timeout 5m
      cleanup:
        - script:
            content: helm uninstall arrchitect --namespace arrchitect --wait --ignore-not-found
    - name: reconcile in the watched namespace
      description: >-
        The download client names a qBittorrent that isn't there, so Sonarr refuses to save it. The
        SyncFailed reason shows the object found its Sonarr and reached the app through it.
      try:
        - apply:
            file: ../resources/arrchitect-sonarr.yaml
        - assert:
            resource:
              apiVersion: arrchitect.dev/v1alpha1
              kind: Sonarr
              metadata:
                name: sonarr
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
                (conditions[?type == 'Synced'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: arrchitect.dev/v1alpha1
              kind: SonarrDownloadClient
              metadata:
                name: sonarr-qbittorrent
              status:
                (conditions[?type == 'Ready'] | [0].status): "False"
                (conditions[?type == 'Ready'] | [0].reason): SyncFailed
      catch: &diagnostics
        - podLogs:
            namespace: arrchitect
            selector: app.kubernetes.io/name=arrchitect
        - describe:
            apiVersion: arrchitect.dev/v1alpha1
            kind: Sonarr
        - describe:
            apiVersion: arrchitect.dev/v1alpha1
            kind: SonarrDownloadClient
    - name: wire an application by reference
      description: >-
        Prowlarr's Sonarr application names the Sonarr resource instead of repeating its address and
        API key. Prowlarr tests an application before saving it, so Synced shows the reference
        resolved to a Sonarr it could reach.
      try:
        - apply:
            file: arrchitect-prowlarr.yaml
        - assert:
            resource:
              apiVersion: arrchitect.dev/v1alpha1
              kind: Prowlarr
              metadata:
                name: prowlarr
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
                (conditions[?type == 'Synced'] | [0].status): "True"
      catch:
        - podLogs:
            namespace: arrchitect
            selector: app.kubernetes.io/name=arrchitect
        - describe:
            apiVersion: arrchitect.dev/v1alpha1
            kind: Prowlarr
    - name: leave turned-off apps and other namespaces alone
      description: >-
        The chart installs CRDs only for the apps it runs, so the step brings Radarr's, as a cluster
        that installed it another way has it. Chainsaw deletes it afterwards only if it created it,
        so the test doesn't depend on another test leaving it behind.
      try:
        - apply:
            file: ../../../chart/arrchitect/files/crds/arrchitect.dev_radarrs.yaml
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: radarrs.arrchitect.dev
              status:
                (conditions[?type == 'Established'] | [0].status): "True"
        - apply:
            file: radarr.yaml
        - script:
            content: |
              outside="$NAMESPACE-outside"
              kubectl create namespace "$outside"
              kubectl -n "$outside" apply -f ../resources/sonarr-outside.yaml
              sleep 30
              [ -z "$(kubectl -n "$NAMESPACE" get radarr radarr -o jsonpath='{.status.conditions}')" ]
              [ -z "$(kubectl -n "$outside" get sonarr outside -o jsonpath='{.status.conditions}')" ]
      cleanup:
        - script:
            content: kubectl delete namespace "$NAMESPACE-outside" --ignore-not-found --wait=false
    - name: serve metrics only to an authorized scraper
      try:
        - apply:
            file: scraper.yaml
        - script:
            content: |
              url=https://arrchitect-metrics.arrchitect.svc.cluster.local:8443/metrics
              scrape() { kubectl -n "$NAMESPACE" exec deploy/sonarr -- curl -sk "$@" "$url"; }
              code=$(scrape -o /dev/null -w '%{http_code}')
              case "$code" in 401|403) ;; *) echo "an anonymous request got $code"; exit 1 ;; esac
              token=$(kubectl -n arrchitect create token scraper)
              for _ in $(seq 30); do
                scrape -f -H "Authorization: Bearer $token" | grep -q '^arrchitect_config_synced' && exit 0
                sleep 2
              done
              echo "the scraper never read the metrics"; exit 1
      catch: *diagnostics
    - name: reconcile when a referenced Secret changes
      description: >-
        The resource reconciles every five minutes, so a reconcile within a minute of the change can
        only come from the Secret watch.
      try:
        - script:
            content: |
              before=$(kubectl -n "$NAMESPACE" get sonarr sonarr -o jsonpath='{.status.lastSyncTime}')
              sleep 1
              kubectl -n "$NAMESPACE" patch secret sonarr --type=merge -p "{\"stringData\":{\"rotated\":\"$(date +%s)\"}}"
              for _ in $(seq 30); do
                [ "$(kubectl -n "$NAMESPACE" get sonarr sonarr -o jsonpath='{.status.lastSyncTime}')" != "$before" ] && exit 0
                sleep 2
              done
              echo "no reconcile within a minute of the Secret change"; exit 1
      catch: *diagnostics

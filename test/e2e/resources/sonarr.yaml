apiVersion: v1
kind: Secret
metadata:
  name: sonarr
stringData:
  api-key: 5f1c0a2e9d4b47e3a8c6b2d1f0e9a7c4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: (env('SONARR_IMAGE'))
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: SONARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: sonarr
                  key: api-key
          ports:
            - containerPort: 8989
          readinessProbe:
            httpGet:
              path: /ping
              port: 8989
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tv
              mountPath: /tv
      volumes:
        - name: config
          emptyDir: {}
        - name: tv
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
spec:
  selector:
    app: sonarr
  ports:
    - port: 8989

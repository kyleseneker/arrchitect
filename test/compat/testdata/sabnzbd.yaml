apiVersion: arrchitect.dev/v1alpha1
kind: Sabnzbd
metadata:
  name: sabnzbd
spec:
  connection:
    url: ${URL}
    apiKeySecretRef:
      name: compat-credentials
      key: api-key
  general:
    downloadSpeedLimit: "50M"
    pauseOnPostProcessing: true
    autoSort: true
    preCheck: true
    topOnly: false
    failHopelessJobs: true
    encryptedRarAction: fail
    unwantedExtensions:
      - exe
      - lnk
    unwantedExtensionsMode: blocklist
    unwantedExtensionsAction: fail
    directUnpack: false
    enableAllPar: false
    sfvCheck: true
    safePostProcessing: true
    enableRecursive: true
    flatUnpack: false
    ignoreSamples: true
    deobfuscateFinalFilenames: true
    scriptCanFail: false
    cleanupList:
      - nfo
      - srr
    historyRetention: days-delete
    historyRetentionNumber: 30
    permissions: "775"
    downloadFree: 1G
    completeFree: 5G
    cacheLimit: 512M
    propagationDelay: 5
    hostWhitelist:
      - sabnzbd.media
    duplicateDetection: tag
    smartDuplicateDetection: pause
    allowProperDuplicates: false
    preQueueScript: check.sh
    queueCompleteScript: done.sh
  folders:
    completeDir: /downloads/complete
    incompleteDir: /downloads/incomplete
    nzbBackupDir: /downloads/nzb-backup
    scriptDir: /config/scripts
  servers:
    - name: Primary
      host: news.example.com
      port: 563
      ssl: true
      connections: 20
      priority: 0
      retention: 3000
      enable: true
      sslVerify: medium
      optional: false
      required: true
      timeout: 30
      sslCiphers: AES128
      usernameSecretRef:
        name: compat-credentials
        key: usenet-username
      passwordSecretRef:
        name: compat-credentials
        key: usenet-password
  categories:
    - name: tv
      dir: tv
      priority: normal
      postProcessing: unpack
    - name: movies
      dir: movies
      priority: high
  apprise:
    enabled: true
    urlsSecretRef:
      name: compat-credentials
      key: apprise-urls
    categories:
      - tv
    events:
      - complete
      - failed
  login:
    usernameSecretRef:
      name: compat-credentials
      key: sab-username
    passwordSecretRef:
      name: compat-credentials
      key: sab-password
  quota:
    size: 500G
    period: week
    resetDay: 1
    resetTime: "03:00"
    resume: true

apiVersion: arrchitect.dev/v1alpha1
kind: Prowlarr
metadata:
  name: prowlarr
spec:
  connection:
    url: ${URL}
    apiKeySecretRef:
      name: compat-credentials
      key: api-key
  appProfiles:
    - name: Compat Profile
      enableRss: true
      enableAutomaticSearch: true
      enableInteractiveSearch: false
      minimumSeeders: 2
  tags:
    - label: tv
  applications:
    - name: Sonarr
      syncLevel: fullSync
      appRef:
        kind: Sonarr
        name: sonarr
      prowlarrUrl: ${PROWLARR_URL}
      authUsernameSecretRef:
        name: compat-credentials
        key: app-auth-username
      authPasswordSecretRef:
        name: compat-credentials
        key: app-auth-password
      syncCategories: [5000, 5040]
      animeSyncCategories: [5070]
      syncAnimeStandardFormatSearch: false
      syncRejectBlocklistedTorrentHashesWhileGrabbing: true
  proxies:
    - name: Compat HTTP
      implementation: Http
      configContract: HttpSettings
      host: proxy.example.invalid
      port: 3128
      usernameSecretRef:
        name: compat-credentials
        key: proxy-username
      passwordSecretRef:
        name: compat-credentials
        key: proxy-password
  indexers:
    - name: Compat Torznab
      implementation: Torznab
      enable: true
      appProfileName: Compat Profile
      priority: 20
      tagLabels: [tv]
      fields:
        - name: baseUrl
          value: ${FAKES}/torznab
        - name: apiPath
          value: /api
        - name: apiKey
          valueFrom:
            secretKeyRef:
              name: compat-credentials
              key: api-key
  downloadClients:
    - name: qBittorrent
      enable: true
      protocol: torrent
      implementation: QBittorrent
      priority: 1
      fields:
        - name: host
          value: ${HOST}
        - name: port
          value: ${QBITTORRENT_PORT}
        - name: username
          valueFrom:
            secretKeyRef:
              name: compat-credentials
              key: qbittorrent-username
        - name: password
          valueFrom:
            secretKeyRef:
              name: compat-credentials
              key: qbittorrent-password
      categories:
        - clientCategory: tv
          categories: [5000, 5040]
  notifications:
    - name: Compat Webhook
      implementation: Webhook
      onGrab: true
      onHealthIssue: true
      onHealthRestored: true
      onApplicationUpdate: true
      includeHealthWarnings: true
      includeManualGrabs: true
      tagLabels: [tv]
      fields:
        - name: url
          value: ${FAKES}/webhook
        - name: method
          value: 1
---
apiVersion: arrchitect.dev/v1alpha1
kind: Sonarr
metadata:
  name: sonarr
spec:
  connection:
    url: ${SONARR_URL}
    apiKeySecretRef:
      name: compat-credentials
      key: sonarr-api-key

apiVersion: arrchitect.dev/v1alpha1
kind: Sonarr
metadata:
  name: sonarr
spec:
  connection:
    url: ${URL}
    apiKeySecretRef:
      name: compat-credentials
      key: api-key
  mediaManagement:
    copyUsingHardlinks: true
    deleteEmptyFolders: true
    importExtraFiles: true
    extraFileExtensions: srt
    downloadPropersAndRepacks: preferAndUpgrade
    enableMediaInfo: true
    rescanAfterRefresh: always
    episodeTitleRequired: always
    minimumFreeSpaceWhenImporting: 100
    fileDate: localAirDate
    chmodFolder: "775"
    chownGroup: "1000"
    autoUnmonitorPreviouslyDownloadedEpisodes: true
    useScriptImport: false
    scriptImportPath: /config/import.sh
  naming:
    renameEpisodes: true
    replaceIllegalCharacters: true
    colonReplacementFormat: custom
    customColonReplacementFormat: " -"
    multiEpisodeStyle: prefixedRange
    standardEpisodeFormat: "{Series TitleYear} - S{season:00}E{episode:00} - {Episode CleanTitle} [{Quality Full}]{-Release Group}"
    dailyEpisodeFormat: "{Series TitleYear} - {Air-Date} - {Episode CleanTitle} [{Quality Full}]{-Release Group}"
    animeEpisodeFormat: "{Series TitleYear} - S{season:00}E{episode:00} - {absolute:000} - {Episode CleanTitle} [{Quality Full}]{-Release Group}"
    seriesFolderFormat: "{Series TitleYear} [tvdbid-{TvdbId}]"
    seasonFolderFormat: "Season {season:00}"
    specialsFolderFormat: Specials
  indexerConfig:
    minimumAge: 0
    retention: 0
    maximumSize: 0
    rssSyncInterval: 15
  downloadClientConfig:
    enableCompletedDownloadHandling: true
    autoRedownloadFailed: true
    autoRedownloadFailedFromInteractiveSearch: true
    downloadClientWorkingFolders: "_UNPACK_|_FAILED_|_TEMP_"
  ui:
    firstDayOfWeek: 1
    shortDateFormat: "MMM D YYYY"
    longDateFormat: "dddd, MMMM D YYYY"
    timeFormat: "h(:mm)a"
    showRelativeDates: true
    theme: dark
    enableColorImpairedMode: false
    uiLanguage: 1
  rootFolders:
    - path: /data/media/tv
  remotePathMappings:
    - host: ${HOST}
      remotePath: /downloads/tv
      localPath: /data/media/tv
  tags:
    - label: Anime
    - label: hdr
  customFormats:
    - name: x265 (HD)
      includeCustomFormatWhenRenaming: false
      specifications:
        - name: x265
          implementation: ReleaseTitleSpecification
          negate: false
          required: true
          fields:
            - name: value
              value: "[xh]\\.?265|HEVC"
        - name: Not 4K
          implementation: ResolutionSpecification
          negate: true
          required: true
          fields:
            - name: value
              value: 2160
    - name: WEBDL
      specifications:
        - name: WEBDL
          implementation: SourceSpecification
          fields:
            - name: value
              value: 3
  qualityProfiles:
    - name: HD-1080p
      upgradeAllowed: true
      cutoff: Bluray-1080p
      minFormatScore: 0
      cutoffFormatScore: 10000
      minUpgradeFormatScore: 1
      items:
        - quality:
            id: 0
            name: Unknown
          allowed: false
        - quality:
            id: 1
            name: SDTV
          allowed: false
        - name: WEB 720p
          allowed: false
          items:
            - quality:
                id: 5
                name: WEBDL-720p
            - quality:
                id: 14
                name: WEBRip-720p
        - name: WEB 1080p
          allowed: true
          items:
            - quality:
                id: 3
                name: WEBDL-1080p
            - quality:
                id: 15
                name: WEBRip-1080p
        - quality:
            id: 7
            name: Bluray-1080p
          allowed: true
        - quality:
            id: 20
            name: Bluray-1080p Remux
          allowed: true
      formatItems:
        - name: x265 (HD)
          score: -5000
        - name: WEBDL
          score: 1000
  notifications:
    - name: Compat Webhook
      implementation: Webhook
      onGrab: true
      onDownload: true
      onImportComplete: true
      onUpgrade: true
      onRename: true
      onHealthIssue: true
      onHealthRestored: true
      includeHealthWarnings: true
      onSeriesAdd: true
      onSeriesDelete: true
      onEpisodeFileDelete: true
      onEpisodeFileDeleteForUpgrade: true
      onApplicationUpdate: true
      onManualInteractionRequired: true
      tagLabels:
        - hdr
      fields:
        - name: url
          value: ${FAKES}/webhook
        - name: method
          value: 1
    - name: Compat Jellyfin
      appRef:
        kind: Jellyfin
        name: jellyfin
      onRename: true
      fields:
        - name: updateLibrary
          value: true
    - name: Compat Plex
      appRef:
        kind: Plex
        name: plex
      onRename: true
      fields:
        - name: updateLibrary
          value: true
  importLists:
    - name: Compat List
      implementation: CustomImport
      enableAutomaticAdd: false
      monitor: all
      qualityProfileName: HD-1080p
      rootFolderPath: /data/media/tv
      seriesType: standard
      seasonFolder: true
      searchOnAdd: false
      monitorNewItems: none
      fields:
        - name: baseUrl
          value: ${FAKES}/lists/sonarr
  qualityDefinitions:
    - quality: HDTV-720p
      minSize: 10
      maxSize: 67.5
      preferredSize: 50
    - quality: Bluray-1080p
      title: Blu-ray 1080p
      minSize: 50.4
      maxSize: 0
      preferredSize: 0
  metadataConsumers:
    - implementation: XbmcMetadata
      fields:
        - name: seriesMetadataUrl
          value: true
        - name: episodeImages
          value: false
  delayProfiles:
    - tagLabels:
        - Anime
      preferredProtocol: torrent
      usenetDelay: 60
      bypassIfAboveCustomFormatScore: true
      minimumCustomFormatScore: 100
    - tagLabels:
        - hdr
      enableUsenet: false
    - usenetDelay: 30
      torrentDelay: 10
  releaseProfiles:
    - name: No x265
      ignored:
        - x265
        - /HEVC/i
      tagLabels:
        - hdr
---
apiVersion: arrchitect.dev/v1alpha1
kind: SonarrDownloadClient
metadata:
  name: sonarr-qbittorrent
spec:
  sonarrRef:
    name: sonarr
  name: qBittorrent
  appRef:
    kind: QBittorrent
    name: qbittorrent
  category: tv
  priority: 1
  removeCompletedDownloads: true
  removeFailedDownloads: true
  tagLabels:
    - hdr
---
apiVersion: arrchitect.dev/v1alpha1
kind: SonarrIndexer
metadata:
  name: sonarr-compat-torznab
spec:
  sonarrRef:
    name: sonarr
  name: Compat Torznab
  protocol: torrent
  downloadClientName: qBittorrent
  implementation: Torznab
  enableRss: true
  enableAutomaticSearch: true
  enableInteractiveSearch: true
  priority: 10
  tagLabels:
    - anime
  fields:
    - name: baseUrl
      value: ${FAKES}/torznab
    - name: apiPath
      value: /api
    - name: apiKey
      valueFrom:
        secretKeyRef:
          name: compat-credentials
          key: api-key
    - name: categories
      value: [5000, 5040]
    - name: minimumSeeders
      value: 1
---
apiVersion: arrchitect.dev/v1alpha1
kind: QBittorrent
metadata:
  name: qbittorrent
spec:
  connection:
    url: http://${HOST}:${QBITTORRENT_PORT}
    usernameSecretRef:
      name: compat-credentials
      key: qbittorrent-username
    passwordSecretRef:
      name: compat-credentials
      key: qbittorrent-password
---
apiVersion: arrchitect.dev/v1alpha1
kind: Jellyfin
metadata:
  name: jellyfin
spec:
  connection:
    url: ${FAKES}/jellyfin
    apiKeySecretRef:
      name: compat-credentials
      key: jellyfin-api-key
  adminUser:
    usernameSecretRef:
      name: compat-credentials
      key: jellyfin-username
    passwordSecretRef:
      name: compat-credentials
      key: jellyfin-password
---
apiVersion: arrchitect.dev/v1alpha1
kind: Plex
metadata:
  name: plex
spec:
  connection:
    url: ${FAKES}/plex
    tokenSecretRef:
      name: compat-credentials
      key: plex-token

apiVersion: arrchitect.dev/v1alpha1
kind: Lidarr
metadata:
  name: lidarr
spec:
  connection:
    url: ${URL}
    apiKeySecretRef:
      name: compat-credentials
      key: api-key
  mediaManagement:
    copyUsingHardlinks: true
    deleteEmptyFolders: true
    importExtraFiles: true
    extraFileExtensions: "lrc,nfo"
    downloadPropersAndRepacks: preferAndUpgrade
    rescanAfterRefresh: always
    minimumFreeSpaceWhenImporting: 100
    createEmptyArtistFolders: false
    fileDate: albumReleaseDate
    chmodFolder: "775"
    chownGroup: "1000"
    autoUnmonitorPreviouslyDownloadedTracks: true
    watchLibraryForChanges: false
    allowFingerprinting: never
    skipFreeSpaceCheckWhenImporting: true
    enableMediaInfo: false
    useScriptImport: false
    scriptImportPath: /config/import.sh
  naming:
    renameTracks: true
    replaceIllegalCharacters: true
    standardTrackFormat: "{Album Title} ({Release Year})/{Artist Name} - {Album Title} - {track:00} - {Track Title}"
    multiDiscTrackFormat: "{Album Title} ({Release Year})/{Medium Format} {medium:00}/{Artist Name} - {Album Title} - {track:00} - {Track Title}"
    artistFolderFormat: "{Artist Name}"
    colonReplacementFormat: dash
  indexerConfig:
    minimumAge: 0
    retention: 0
    maximumSize: 0
    rssSyncInterval: 15
  downloadClientConfig:
    enableCompletedDownloadHandling: true
    autoRedownloadFailed: true
    autoRedownloadFailedFromInteractiveSearch: false
    downloadClientWorkingFolders: "_UNPACK_|_FAILED_|_TEMP_"
  ui:
    firstDayOfWeek: 1
    shortDateFormat: "MMM D YYYY"
    longDateFormat: "dddd, MMMM D YYYY"
    timeFormat: "h(:mm)a"
    showRelativeDates: true
    theme: dark
    enableColorImpairedMode: false
    uiLanguage: 1
  metadataProvider:
    metadataSource: ${FAKES}/musicinfo
    writeAudioTags: sync
    scrubAudioTags: true
    embedCoverArt: true
  metadataProfiles:
    - name: Albums Only
      primaryAlbumTypes:
        - Album
        - EP
      secondaryAlbumTypes:
        - Studio
      releaseStatuses:
        - Official
  rootFolders:
    - path: /data/media/music
      defaultQualityProfileName: Music
      defaultMetadataProfileName: Albums Only
      defaultMonitorOption: future
      defaultNewItemMonitorOption: new
      defaultTagLabels:
        - favorites
  remotePathMappings:
    - host: ${HOST}
      remotePath: /downloads/music
      localPath: /data/media/music
  tags:
    - label: favorites
    - label: live
  qualityProfiles:
    - name: Music
      upgradeAllowed: true
      cutoff: Lossless
      items:
        - quality:
            id: 4
            name: MP3-320
          allowed: true
        - name: Lossless
          allowed: true
          items:
            - quality:
                id: 6
                name: FLAC
            - quality:
                id: 7
                name: ALAC
  notifications:
    - name: Compat Webhook
      implementation: Webhook
      onGrab: true
      onReleaseImport: true
      onUpgrade: true
      onRename: true
      onDownloadFailure: true
      onImportFailure: true
      onArtistAdd: true
      onArtistDelete: true
      onAlbumDelete: true
      onTrackRetag: true
      onHealthIssue: true
      onHealthRestored: true
      includeHealthWarnings: true
      onApplicationUpdate: true
      tagLabels:
        - favorites
      fields:
        - name: url
          value: ${FAKES}/webhook
        - name: method
          value: 1
    - name: Compat Jellyfin
      appRef:
        kind: Jellyfin
        name: jellyfin
      onRename: true
      fields:
        - name: updateLibrary
          value: true
    - name: Compat Plex
      appRef:
        kind: Plex
        name: plex
      onRename: true
      fields:
        - name: updateLibrary
          value: true
  importLists:
    - name: Compat List
      implementation: CustomImport
      enableAutomaticAdd: false
      monitor: entireArtist
      qualityProfileName: Music
      metadataProfileName: Albums Only
      rootFolderPath: /data/media/music
      searchOnAdd: false
      monitorNewItems: new
      monitorExisting: true
      fields:
        - name: baseUrl
          value: ${FAKES}/lists/lidarr
  qualityDefinitions:
    - quality: FLAC
      maxSize: 0
      preferredSize: 900
    - quality: MP3-320
      title: MP3 320
      minSize: 100
      maxSize: 400
      preferredSize: 350
  metadataConsumers:
    - implementation: XbmcMetadata
      fields:
        - name: albumImages
          value: false
  autoTags:
    - name: Compat Albums
      tagLabels: [live]
      specifications:
        - name: Albums
          implementation: MetadataProfileSpecification
          metadataProfileName: Albums Only
        - name: Favorites
          implementation: TagSpecification
          negate: true
          tagLabel: favorites
  delayProfiles:
    - tagLabels:
        - favorites
      preferredProtocol: torrent
      enableUsenet: false
      torrentDelay: 15
    - tagLabels:
        - live
      usenetDelay: 5
    - usenetDelay: 30
---
apiVersion: arrchitect.dev/v1alpha1
kind: LidarrDownloadClient
metadata:
  name: lidarr-qbittorrent
spec:
  lidarrRef:
    name: lidarr
  name: qBittorrent
  protocol: torrent
  implementation: QBittorrent
  host: ${HOST}
  port: ${QBITTORRENT_PORT}
  category: music
  priority: 1
  removeCompletedDownloads: true
  removeFailedDownloads: true
  tagLabels:
    - favorites
  usernameSecretRef:
    name: compat-credentials
    key: qbittorrent-username
  passwordSecretRef:
    name: compat-credentials
    key: qbittorrent-password
---
apiVersion: arrchitect.dev/v1alpha1
kind: LidarrIndexer
metadata:
  name: lidarr-compat-torznab
spec:
  lidarrRef:
    name: lidarr
  name: Compat Torznab
  protocol: torrent
  downloadClientName: qBittorrent
  implementation: Torznab
  enableRss: true
  enableAutomaticSearch: true
  enableInteractiveSearch: true
  priority: 10
  tagLabels:
    - favorites
  fields:
    - name: baseUrl
      value: ${FAKES}/torznab
    - name: apiPath
      value: /api
    - name: apiKey
      valueFrom:
        secretKeyRef:
          name: compat-credentials
          key: api-key
    - name: categories
      value: [3000, 3040]
    - name: minimumSeeders
      value: 1
---
apiVersion: arrchitect.dev/v1alpha1
kind: Jellyfin
metadata:
  name: jellyfin
spec:
  connection:
    url: ${FAKES}/jellyfin
    apiKeySecretRef:
      name: compat-credentials
      key: jellyfin-api-key
  adminUser:
    usernameSecretRef:
      name: compat-credentials
      key: jellyfin-username
    passwordSecretRef:
      name: compat-credentials
      key: jellyfin-password
---
apiVersion: arrchitect.dev/v1alpha1
kind: Plex
metadata:
  name: plex
spec:
  connection:
    url: ${FAKES}/plex
    tokenSecretRef:
      name: compat-credentials
      key: plex-token

apiVersion: arrchitect.dev/v1alpha1
kind: Seerr
metadata:
  name: seerr
spec:
  connection:
    url: ${URL}
  jellyfinAuth:
    hostname: ${HOST}
    port: ${JELLYFIN_PORT}
    useSsl: false
    usernameSecretRef:
      name: compat-credentials
      key: jellyfin-username
    passwordSecretRef:
      name: compat-credentials
      key: jellyfin-password
  libraries:
    - Movies
  network:
    trustProxy: true
  jobSchedules:
    - id: sonarr-scan
      schedule: "0 0 */6 * * *"
    - id: image-cache-cleanup
      schedule: "0 0 6 * * *"
  main:
    applicationTitle: Compat Requests
    applicationUrl: https://requests.example.com
    hideAvailable: true
    localLogin: true
    mediaServerLogin: true
    defaultPermissions: 32
    partialRequestsEnabled: true
    locale: en
    newMediaServerLogin: true
    hideRequested: true
    hideBlocklisted: true
    enableSpecialEpisodes: true
    cacheImages: false
    versionCheck: false
    youtubeUrl: https://youtube.example.com
    discoverRegion: US
    streamingRegion: GB
    originalLanguages: [en, ja]
    blocklistedTags: [210024]
    blocklistedTagsLimit: 10
    blocklistRegion: JP
    blocklistLanguages: [ja]
    defaultQuotas:
      movie: {limit: 5, days: 7}
      tv: {limit: 10}
  sonarr:
    - name: Sonarr
      appRef:
        kind: Sonarr
        name: sonarr
      activeProfileName: HD-1080p
      activeDirectory: /data/media/tv
      is4k: false
      isDefault: true
      seriesType: standard
      enableSeasonFolders: true
      externalUrl: https://sonarr.example.com
      syncEnabled: true
      preventSearch: false
      tagRequests: true
      activeAnimeProfileName: HD-1080p
      activeAnimeDirectory: /data/media/tv
      animeSeriesType: anime
      monitorNewItems: all
    - name: Sonarr 4K
      hostname: ${HOST}
      port: ${SONARR_PORT}
      apiKeySecretRef:
        name: compat-credentials
        key: sonarr-api-key
      activeProfileName: HD-1080p
      activeDirectory: /data/media/tv
      is4k: true
      isDefault: true
  radarr:
    - name: Radarr
      hostname: ${HOST}
      port: ${RADARR_PORT}
      apiKeySecretRef:
        name: compat-credentials
        key: radarr-api-key
      useSsl: false
      activeProfileName: HD-1080p
      activeDirectory: /data/media/movies
      is4k: false
      isDefault: true
      minimumAvailability: released
  notifications:
    - agent: discord
      enabled: true
      types:
        - mediaPending
        - mediaApproved
        - mediaAutoApproved
        - mediaAutoRequested
        - mediaAvailable
        - mediaFailed
        - mediaDeclined
        - issueCreated
        - issueComment
        - issueResolved
        - issueReopened
      options:
        - name: botUsername
          value: Compat
        - name: enableMentions
          value: false
        - name: webhookUrl
          valueFrom:
            secretKeyRef:
              name: compat-credentials
              key: discord-webhook
---
apiVersion: arrchitect.dev/v1alpha1
kind: Sonarr
metadata:
  name: sonarr
spec:
  connection:
    url: http://${HOST}:${SONARR_PORT}
    apiKeySecretRef:
      name: compat-credentials
      key: sonarr-api-key

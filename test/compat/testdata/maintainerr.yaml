apiVersion: arrchitect.dev/v1alpha1
kind: Maintainerr
metadata:
  name: maintainerr
spec:
  connection:
    url: ${URL}
  mediaServer:
    jellyfin:
      appRef:
        kind: Jellyfin
        name: jellyfin
  radarr:
    - name: Radarr
      appRef:
        kind: Radarr
        name: radarr
      tagExclusions: true
      exclusionTag: keep
  seerr:
    url: ${FAKES}/seerr
    apiKeySecretRef:
      name: compat-credentials
      key: seerr-api-key
  jobs:
    rules: "0 0-23/8 * * *"
    collections: "0 0-23/12 * * *"
  notifications:
    - name: Compat webhook
      agent: webhook
      enabled: true
      types:
        - mediaAboutToBeHandled
        - mediaHandled
        - ruleHandlingFailed
      aboutScale: 5
      options:
        - name: jsonPayload
          value: '{"subject":"{{notification_type}}"}'
        - name: webhookUrl
          valueFrom:
            secretKeyRef:
              name: compat-credentials
              key: webhook-url
  ruleGroups:
    - name: Stale unwatched movies
      description: Added over 180 days ago and never watched
      library: Movies
      arrAction: unmonitorDeleteAll
      actionAfterDays: 30
      radarrServer: Radarr
      listExclusions: true
      cleanupLeftoverFolders: true
      schedule: "0 3 * * *"
      notifications:
        - Compat webhook
      sections:
        - rules:
            - firstValue: Jellyfin.addDate
              action: BEFORE
              customValue:
                type: custom_days
                value: 180
            - operator: AND
              firstValue: Jellyfin.viewCount
              action: EQUALS
              customValue:
                type: number
                value: 0
        - operator: OR
          rules:
            - firstValue: Radarr.monitored
              action: EQUALS
              customValue:
                type: boolean
                value: "false"
---
apiVersion: arrchitect.dev/v1alpha1
kind: Radarr
metadata:
  name: radarr
spec:
  connection:
    url: http://${HOST}:${RADARR_PORT}
    apiKeySecretRef:
      name: compat-credentials
      key: radarr-api-key
---
apiVersion: arrchitect.dev/v1alpha1
kind: Jellyfin
metadata:
  name: jellyfin
spec:
  connection:
    url: http://${HOST}:${JELLYFIN_PORT}
    apiKeySecretRef:
      name: compat-credentials
      key: jellyfin-api-key
  adminUser:
    usernameSecretRef:
      name: compat-credentials
      key: jellyfin-username
    passwordSecretRef:
      name: compat-credentials
      key: jellyfin-password

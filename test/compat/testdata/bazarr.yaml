apiVersion: arrchitect.dev/v1alpha1
kind: Bazarr
metadata:
  name: bazarr
spec:
  connection:
    url: ${URL}
    apiKeySecretRef:
      name: compat-credentials
      key: api-key
  general:
    useSonarr: true
    useRadarr: true
    minimumScore: 90
    minimumScoreMovie: 70
    useScenename: true
    usePostprocessing: false
    adaptiveSearching: true
    adaptiveSearchingDelay: 2w
    adaptiveSearchingDelta: 3d
    multithreading: true
    upgradeSubs: true
    upgradeFrequency: 12
    daysToUpgradeSubs: 14
    upgradeManual: false
    wantedSearchFrequency: 6
    wantedSearchFrequencyMovie: 24
    seriesTagEnabled: true
    movieTagEnabled: false
    removeProfileTags:
      - no-subs
    utf8Encode: true
    ignorePgsSubs: false
    ignoreVobsubSubs: false
    ignoreAssSubs: false
    embeddedSubtitlesParser: ffprobe
    hiExtension: hi
    pathMappings:
      - remotePath: /data/media/tv
        localPath: /media/tv
      - remotePath: /anime
        localPath: /media/anime
    pathMappingsMovie:
      - remotePath: /data/media/movies
        localPath: /media/movies
    seriesDefaultProfile: English
    movieDefaultProfile: Hand-made
    useEmbeddedSubs: true
    subfolder: relative
    subfolderCustom: Subs
    chmodEnabled: true
    chmod: "0644"
    postprocessingCmd: echo done
    usePostprocessingThreshold: true
    postprocessingThreshold: 80
    usePostprocessingThresholdMovie: false
    postprocessingThresholdMovie: 60
  sonarrConnection:
    appRef:
      kind: Sonarr
      name: sonarr
    httpTimeout: 300
    fullUpdate: Daily
    onlyMonitored: false
    syncInterval: 60
    excludedTags:
      - nosubs
    excludedSeriesTypes:
      - daily
    excludeSeasonZero: true
  radarrConnection:
    host: ${HOST}
    port: ${RADARR_PORT}
    apiKeySecretRef:
      name: compat-credentials
      key: radarr-api-key
    httpTimeout: 300
    fullUpdate: Daily
    onlyMonitored: false
    syncInterval: 60
    excludedTags:
      - nosubs
  jellyfin:
    appRef:
      kind: Jellyfin
      name: jellyfin
    movieLibraries:
      - Movies
    seriesLibraries:
      - Shows
    refreshMethod: async
  subSync:
    useSubsync: true
    useSubsyncThreshold: true
    subsyncThreshold: 90
    useSubsyncMovieThreshold: true
    subsyncMovieThreshold: 70
  providers:
    - name: podnapisi
      enabled: true
    - name: yifysubtitles
      enabled: true
    - name: tvsubtitles
      enabled: true
  languages:
    enabled:
      - en
      - es
    profiles:
      - profileId: 1
        name: English
        items:
          - language: en
            hi: false
            forced: false
            audioExclude: false
          - language: es
            audioOnlyInclude: true
        cutoff: en
        mustContain:
          - WEB
        mustNotContain:
          - CAM
        originalFormat: true
        tag: english
  notifications:
    - name: Discord
      enabled: true
      urlSecretRef:
        name: compat-credentials
        key: discord-url
---
apiVersion: arrchitect.dev/v1alpha1
kind: Sonarr
metadata:
  name: sonarr
spec:
  connection:
    url: http://${HOST}:${SONARR_PORT}
    apiKeySecretRef:
      name: compat-credentials
      key: sonarr-api-key
---
apiVersion: arrchitect.dev/v1alpha1
kind: Jellyfin
metadata:
  name: jellyfin
spec:
  connection:
    url: ${FAKES}/jellyfin
    apiKeySecretRef:
      name: compat-credentials
      key: jellyfin-api-key
  adminUser:
    usernameSecretRef:
      name: compat-credentials
      key: jellyfin-username
    passwordSecretRef:
      name: compat-credentials
      key: jellyfin-password

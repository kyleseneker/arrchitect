{{- $apps := splitList "," (include "media-operator.enabledApps" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "media-operator.fullname" . }}
  labels:
    {{- include "media-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - media-operator.dev
    resources:
      {{- range $apps }}
      - {{ . }}configs
      {{- end }}
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - media-operator.dev
    resources:
      {{- range $apps }}
      - {{ . }}configs/status
      {{- end }}
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - media-operator.dev
    resources:
      {{- range $apps }}
      - {{ . }}configs/finalizers
      {{- end }}
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
{{- if not .Values.watchNamespace }}
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
{{- end }}

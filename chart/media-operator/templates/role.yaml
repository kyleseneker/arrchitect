apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "media-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "media-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
{{- range $ns := splitList "," .Values.watchNamespace }}
{{- with trim $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "media-operator.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "media-operator.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
{{- end }}
{{- end }}

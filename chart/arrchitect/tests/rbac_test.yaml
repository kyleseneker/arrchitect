suite: RBAC
templates:
  - templates/clusterrole.yaml
  - templates/clusterrolebinding.yaml
  - templates/role.yaml
  - templates/rolebinding.yaml
release:
  name: arrchitect
  namespace: arrchitect
tests:
  - it: reads Secrets in every namespace when it watches every namespace
    template: templates/clusterrole.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            verbs:
              - get
              - list
              - watch
  - it: grants nothing cluster-wide when it watches some namespaces
    set:
      watchNamespace: media, arr
    asserts:
      - template: templates/clusterrole.yaml
        hasDocuments:
          count: 0
      - template: templates/clusterrolebinding.yaml
        hasDocuments:
          count: 0
  - it: grants its rules only in the namespaces it watches
    set:
      watchNamespace: media, arr
    asserts:
      - template: templates/role.yaml
        hasDocuments:
          count: 3
      - template: templates/role.yaml
        documentIndex: 1
        equal:
          path: metadata.namespace
          value: media
      - template: templates/role.yaml
        documentIndex: 2
        equal:
          path: metadata.namespace
          value: arr
      - template: templates/role.yaml
        documentIndex: 1
        contains:
          path: rules[0].resources
          content: sonarrs
      - template: templates/role.yaml
        documentIndex: 1
        contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            verbs:
              - get
              - list
              - watch
      - template: templates/rolebinding.yaml
        documentIndex: 1
        equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: arrchitect
  - it: refuses a watchNamespace with no namespace in it
    template: templates/rolebinding.yaml
    set:
      watchNamespace: " , ,"
    asserts:
      - failedTemplate:
          errorPattern: watchNamespace must list at least one namespace
  - it: keeps the leader election lease in the release namespace
    template: templates/role.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.namespace
          value: arrchitect
      - contains:
          path: rules[0].resources
          content: leases
  - it: records leader election events in the release namespace
    template: templates/role.yaml
    documentIndex: 0
    set:
      watchNamespace: media
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
              - events.k8s.io
            resources:
              - events
            verbs:
              - create
              - patch
  - it: grants one Role per namespace when a namespace is listed twice
    set:
      watchNamespace: media, arr,media ,
    asserts:
      - template: templates/role.yaml
        hasDocuments:
          count: 3
      - template: templates/rolebinding.yaml
        hasDocuments:
          count: 3
      - template: templates/role.yaml
        documentIndex: 2
        equal:
          path: metadata.namespace
          value: arr
  - it: grants nothing for a turned-off app
    template: templates/clusterrole.yaml
    set:
      apps.tdarr: false
    asserts:
      - notContains:
          path: rules[0].resources
          content: tdarrs
      - contains:
          path: rules[0].resources
          content: sonarrs

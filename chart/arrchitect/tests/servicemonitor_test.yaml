suite: servicemonitor
templates:
  - templates/servicemonitor.yaml
tests:
  - it: is off by default
    asserts:
      - hasDocuments:
          count: 0
  - it: keeps each resource's namespace label
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.endpoints[0].honorLabels
          value: true

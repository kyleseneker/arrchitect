replicaCount: 1

image:
  repository: ghcr.io/kyleseneker/arrchitect
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

apps:
  sonarr: true
  radarr: true
  lidarr: true
  readarr: true
  prowlarr: true
  flaresolverr: true
  bazarr: true
  qbittorrent: true
  sabnzbd: true
  jellyfin: true
  plex: true
  seerr: true
  maintainerr: true
  tdarr: true
  autobrr: true

crds:
  enabled: true

serviceAccount:
  create: true
  name: arrchitect

rbac:
  # Grant access to the enabled apps' resources through the built-in view, edit
  # and admin roles.
  aggregateClusterRoles: true

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Namespaces to watch, comma-separated. Empty watches every namespace.
watchNamespace: ""

# How many resources of one kind reconcile at once.
maxConcurrentReconciles: 2

# How long one reconcile may run before it's cancelled, so a stalled app can't
# hold a worker.
reconcileTimeout: 10m

# debug, info or error. debug logs the full error each app sends back.
logLevel: info

extraArgs: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

# Metrics are served on :8443 over HTTPS and need a token with access to them.
# arrchitect_config_synced is 0 when a resource's last reconcile failed.
metrics:
  enabled: true
  serviceMonitor:
    # Create a ServiceMonitor. Needs the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    # Keep the namespace label of each resource's metrics instead of renaming
    # it to exported_namespace. Prometheus advises against it unless you trust
    # the target, and admins can override it.
    honorLabels: false
    # Additional labels applied to the ServiceMonitor (e.g., for Prometheus selector matching).
    labels: {}
  prometheusRule:
    # Create a PrometheusRule that alerts on a resource out of sync for 15
    # minutes, drift that never settles and, with the ServiceMonitor, the
    # operator being down. Needs the Prometheus Operator CRDs.
    enabled: false
    # Additional labels applied to the PrometheusRule (e.g., for Prometheus rule selector matching).
    labels: {}

nodeSelector: {}
tolerations: []
affinity: {}

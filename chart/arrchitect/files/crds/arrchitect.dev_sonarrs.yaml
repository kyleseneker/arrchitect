---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.23.0
  name: sonarrs.arrchitect.dev
spec:
  group: arrchitect.dev
  names:
    categories:
    - arrchitect
    kind: Sonarr
    listKind: SonarrList
    plural: sonarrs
    singular: sonarr
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Sonarr configures a Sonarr instance the operator connects to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of the Sonarr.
            properties:
              connection:
                description: connection defines how to connect to the Sonarr instance.
                properties:
                  apiKeySecretRef:
                    description: apiKeySecretRef references a Secret containing the
                      API key.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tls:
                    description: |-
                      tls configures TLS settings for the connection.
                      Only needed when the app uses HTTPS with self-signed or private CA certificates.
                    properties:
                      caSecretRef:
                        description: |-
                          caSecretRef references a Secret containing a PEM-encoded CA certificate bundle
                          used to verify the target app's TLS certificate.
                          The Secret must contain the CA certificate under the specified key.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            minLength: 1
                            type: string
                          name:
                            description: name is the name of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      insecureSkipVerify:
                        description: |-
                          insecureSkipVerify disables TLS certificate verification.
                          WARNING: This makes the connection susceptible to machine-in-the-middle attacks.
                          Only use for testing or when the target app uses a self-signed certificate and
                          providing a CA is not practical.
                        type: boolean
                    type: object
                  url:
                    description: url is the base URL of the app (e.g., http://arr-sonarr.arr.svc.cluster.local:8989).
                    minLength: 1
                    pattern: ^https?://
                    type: string
                required:
                - apiKeySecretRef
                - url
                type: object
              customFormats:
                description: customFormats defines custom format scoring rules for
                  release selection.
                items:
                  description: |-
                    CustomFormat defines a custom format with matching specifications.
                    Custom formats score releases based on matching conditions and are used
                    within quality profiles to guide upgrade decisions.
                  properties:
                    includeCustomFormatWhenRenaming:
                      description: |-
                        includeCustomFormatWhenRenaming includes this format's name in renamed filenames
                        via the {Custom Formats} naming token.
                      type: boolean
                    name:
                      description: name is the display name of the custom format.
                      minLength: 1
                      type: string
                    specifications:
                      description: |-
                        specifications defines the matching conditions for this custom format.
                        A release matches if all required specs match and at least one non-required spec matches.
                      items:
                        description: CustomFormatSpecification defines a single matching
                          condition within a custom format.
                        properties:
                          fields:
                            description: |-
                              fields defines the specification's configuration values.
                              Most specs have a single field named "value" (e.g., a regex pattern or enum int).
                              SizeSpecification has "min" and "max" fields (floats in GB).
                            items:
                              description: |-
                                ConfigField is a named field of a provider's configuration. It sets value
                                or valueFrom, not both.
                              maxProperties: 2
                              properties:
                                name:
                                  description: name is the field name.
                                  minLength: 1
                                  type: string
                                value:
                                  description: 'value is the field value: a string,
                                    number, boolean or list.'
                                  x-kubernetes-preserve-unknown-fields: true
                                valueFrom:
                                  description: valueFrom reads the field value from
                                    a source.
                                  properties:
                                    secretKeyRef:
                                      description: secretKeyRef reads the value from
                                        a key of a Secret in the resource's namespace.
                                      properties:
                                        key:
                                          description: key is the key within the Secret.
                                          minLength: 1
                                          type: string
                                        name:
                                          description: name is the name of the Secret.
                                          minLength: 1
                                          type: string
                                      required:
                                      - key
                                      - name
                                      type: object
                                  required:
                                  - secretKeyRef
                                  type: object
                              required:
                              - name
                              type: object
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                          implementation:
                            description: |-
                              implementation is the specification type.
                              Common values: ReleaseTitleSpecification, SourceSpecification, ResolutionSpecification,
                              QualityModifierSpecification, LanguageSpecification, ReleaseGroupSpecification,
                              EditionSpecification (Radarr), ReleaseTypeSpecification (Sonarr), SizeSpecification,
                              IndexerFlagSpecification.
                            minLength: 1
                            type: string
                          name:
                            description: name is a human-readable label for this condition.
                            minLength: 1
                            type: string
                          negate:
                            description: negate inverts the match logic. If true,
                              the spec matches when the condition is NOT met.
                            type: boolean
                          required:
                            description: |-
                              required makes this spec mandatory. If true, the custom format only matches when
                              this spec matches. If false, this spec participates in OR logic with other non-required specs.
                            type: boolean
                        required:
                        - implementation
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              delayProfiles:
                description: |-
                  delayProfiles defines delay profiles. The app checks tagged profiles in
                  the order listed, and the default profile, the one without tags, last.
                  Only operator-created profiles can be pruned, so the default never is.
                items:
                  description: |-
                    DelayProfile holds a release back for a while, so a better one can turn up
                    before the app grabs it. A profile is matched to the app's by its tags, and
                    the app allows a tag in only one profile.
                  properties:
                    bypassIfAboveCustomFormatScore:
                      description: |-
                        bypassIfAboveCustomFormatScore skips the delay for a release whose custom
                        format score reaches minimumCustomFormatScore.
                      type: boolean
                    bypassIfHighestQuality:
                      description: |-
                        bypassIfHighestQuality skips the delay for a release at the quality
                        profile's highest allowed quality.
                      type: boolean
                    enableTorrent:
                      description: enableTorrent allows torrent releases.
                      type: boolean
                    enableUsenet:
                      description: enableUsenet allows Usenet releases.
                      type: boolean
                    minimumCustomFormatScore:
                      description: minimumCustomFormatScore is the score bypassIfAboveCustomFormatScore
                        needs.
                      format: int32
                      type: integer
                    preferredProtocol:
                      description: preferredProtocol is the protocol the app picks
                        when a release is on both.
                      enum:
                      - usenet
                      - torrent
                      type: string
                    tagLabels:
                      description: |-
                        tagLabels limits the profile to items with one of these tags. The profile
                        without tags is the app's default, which covers everything the others don't.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    torrentDelay:
                      description: torrentDelay is how many minutes the app waits
                        before grabbing a torrent release.
                      format: int32
                      minimum: 0
                      type: integer
                    usenetDelay:
                      description: usenetDelay is how many minutes the app waits before
                        grabbing a Usenet release.
                      format: int32
                      minimum: 0
                      type: integer
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: only one delay profile can be without tags
                  rule: self.filter(p, !has(p.tagLabels) || size(p.tagLabels) == 0).size()
                    <= 1
              downloadClientConfig:
                description: downloadClientConfig configures global download client
                  behavior.
                properties:
                  autoRedownloadFailed:
                    description: autoRedownloadFailed automatically searches when
                      a download fails.
                    type: boolean
                  autoRedownloadFailedFromInteractiveSearch:
                    description: autoRedownloadFailedFromInteractiveSearch auto-searches
                      failed interactive searches.
                    type: boolean
                  downloadClientWorkingFolders:
                    description: |-
                      downloadClientWorkingFolders lists, separated by |, the folders download
                      clients unpack and fail into, which imports skip. The app's default is
                      _UNPACK_|_FAILED_.
                    minLength: 1
                    type: string
                  enableCompletedDownloadHandling:
                    description: enableCompletedDownloadHandling auto-imports completed
                      downloads.
                    type: boolean
                type: object
              importLists:
                description: importLists defines import list configurations for automatic
                  content addition.
                items:
                  description: ImportList defines an import list that adds content
                    to Sonarr, Radarr, Lidarr or Readarr.
                  properties:
                    configContract:
                      description: |-
                        configContract is the configuration contract name for the implementation.
                        Defaults to "<implementation>Settings" if not set.
                      minLength: 1
                      type: string
                    enable:
                      description: |-
                        enable controls whether this import list is active. A new import list is
                        enabled unless this is false.
                      type: boolean
                    enableAutomaticAdd:
                      description: enableAutomaticAdd automatically adds items from
                        this list.
                      type: boolean
                    fields:
                      description: fields defines the import list's configuration
                        fields (e.g., API URL, access token, list ID).
                      items:
                        description: |-
                          ConfigField is a named field of a provider's configuration. It sets value
                          or valueFrom, not both.
                        maxProperties: 2
                        properties:
                          name:
                            description: name is the field name.
                            minLength: 1
                            type: string
                          value:
                            description: 'value is the field value: a string, number,
                              boolean or list.'
                            x-kubernetes-preserve-unknown-fields: true
                          valueFrom:
                            description: valueFrom reads the field value from a source.
                            properties:
                              secretKeyRef:
                                description: secretKeyRef reads the value from a key
                                  of a Secret in the resource's namespace.
                                properties:
                                  key:
                                    description: key is the key within the Secret.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: name is the name of the Secret.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - secretKeyRef
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    implementation:
                      description: implementation is the import list type (e.g., TraktListImport,
                        IMDbListImport, SonarrImport).
                      minLength: 1
                      type: string
                    listOrder:
                      description: listOrder controls the display order of this list.
                      format: int32
                      type: integer
                    metadataProfileName:
                      description: |-
                        metadataProfileName is the metadata profile for imported items (Lidarr,
                        Readarr). Resolved to an ID at reconciliation time.
                      minLength: 1
                      type: string
                    minimumAvailability:
                      description: 'minimumAvailability controls when imported movies
                        are considered available (Radarr: announced, inCinemas, released).'
                      minLength: 1
                      type: string
                    monitor:
                      description: |-
                        monitor controls how imported items are monitored.
                        Values vary by app (Sonarr: all, future, missing, existing, firstSeason, lastSeason, latestSeason,
                        pilot, recent, monitorSpecials, unmonitorSpecials, none; Radarr: movieOnly, movieAndCollection, none;
                        Lidarr: entireArtist, specificAlbum, none; Readarr: entireAuthor, specificBook, none).
                      minLength: 1
                      type: string
                    monitorExisting:
                      description: |-
                        monitorExisting also applies monitor to artists or authors already in the
                        library (Lidarr's and Readarr's shouldMonitorExisting).
                      type: boolean
                    monitorNewItems:
                      description: |-
                        monitorNewItems monitors seasons, albums or books added later to what the
                        list added: all or none, or in Lidarr and Readarr new. Sonarr, Lidarr and
                        Readarr only.
                      enum:
                      - all
                      - none
                      - new
                      type: string
                    name:
                      description: name is the display name of the import list.
                      minLength: 1
                      type: string
                    qualityProfileName:
                      description: |-
                        qualityProfileName is the name of the quality profile to assign to imported items.
                        Must match an existing quality profile. Resolved to an ID at reconciliation time.
                      minLength: 1
                      type: string
                    rootFolderPath:
                      description: rootFolderPath is the root folder path for imported
                        items.
                      minLength: 1
                      type: string
                    searchOnAdd:
                      description: |-
                        searchOnAdd searches for what the list adds (Sonarr's
                        searchForMissingEpisodes, Lidarr's and Readarr's shouldSearch).
                      type: boolean
                    seasonFolder:
                      description: seasonFolder enables season folders for imported
                        items (Sonarr).
                      type: boolean
                    seriesType:
                      description: 'seriesType is the series type for imported items
                        (Sonarr: standard, daily, anime).'
                      minLength: 1
                      type: string
                    tagLabels:
                      description: |-
                        tagLabels references tags by label, resolved against the app on each
                        reconciliation. A missing or ambiguous label blocks writes, and an empty
                        list clears the tags.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - implementation
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              indexerConfig:
                description: indexerConfig configures global indexer settings.
                properties:
                  maximumSize:
                    description: maximumSize is the maximum release size in MB. 0
                      means unlimited.
                    format: int32
                    type: integer
                  minimumAge:
                    description: minimumAge is the minimum age in minutes before downloading.
                    format: int32
                    type: integer
                  retention:
                    description: retention is the usenet retention in days. 0 means
                      unlimited.
                    format: int32
                    type: integer
                  rssSyncInterval:
                    description: rssSyncInterval is the RSS sync interval in minutes.
                      0 disables RSS.
                    format: int32
                    type: integer
                type: object
              mediaManagement:
                description: mediaManagement configures media management settings.
                properties:
                  autoUnmonitorPreviouslyDownloadedEpisodes:
                    description: |-
                      autoUnmonitorPreviouslyDownloadedEpisodes unmonitors episodes deleted from
                      disk.
                    type: boolean
                  chmodFolder:
                    description: |-
                      chmodFolder is the octal mode, such as 755, given to media folders
                      when setPermissionsLinux is on. Files get it without the execute bits.
                    minLength: 3
                    pattern: ^[0-7]{3,4}$
                    type: string
                  chownGroup:
                    description: |-
                      chownGroup is the group name or gid given to imported files when
                      setPermissionsLinux is on. An empty string leaves the group alone.
                    type: string
                  copyUsingHardlinks:
                    description: copyUsingHardlinks uses hardlinks instead of copies
                      when importing.
                    type: boolean
                  createEmptySeriesFolders:
                    description: createEmptySeriesFolders creates folders for series
                      with no files.
                    type: boolean
                  deleteEmptyFolders:
                    description: deleteEmptyFolders removes empty series folders after
                      cleanup.
                    type: boolean
                  downloadPropersAndRepacks:
                    description: downloadPropersAndRepacks controls how proper/repack
                      releases are handled.
                    enum:
                    - preferAndUpgrade
                    - doNotPrefer
                    - doNotUpgrade
                    type: string
                  enableMediaInfo:
                    description: enableMediaInfo enables media info scanning.
                    type: boolean
                  episodeTitleRequired:
                    description: episodeTitleRequired controls when episode titles
                      are required.
                    enum:
                    - always
                    - bulkSeasonReleases
                    - never
                    type: string
                  extraFileExtensions:
                    description: extraFileExtensions is a comma-separated list of
                      extra file extensions to import.
                    minLength: 1
                    type: string
                  fileDate:
                    description: |-
                      fileDate sets an imported file's modified date: none keeps it,
                      localAirDate and utcAirDate use the episode's air date.
                    enum:
                    - none
                    - localAirDate
                    - utcAirDate
                    type: string
                  importExtraFiles:
                    description: importExtraFiles imports additional files (subtitles,
                      etc.) alongside media.
                    type: boolean
                  minimumFreeSpaceWhenImporting:
                    description: minimumFreeSpaceWhenImporting is the minimum free
                      space in MB required to import.
                    format: int32
                    type: integer
                  recycleBin:
                    description: |-
                      recycleBin is the path to the recycling bin folder. An empty string
                      turns the recycling bin off.
                    type: string
                  recycleBinCleanupDays:
                    description: recycleBinCleanupDays is how many days files stay
                      in the recycling bin.
                    format: int32
                    type: integer
                  rescanAfterRefresh:
                    description: rescanAfterRefresh controls when to rescan series
                      folders.
                    enum:
                    - always
                    - afterManual
                    - never
                    type: string
                  scriptImportPath:
                    description: |-
                      scriptImportPath is the script run for each import when useScriptImport
                      is on.
                    minLength: 1
                    type: string
                  setPermissionsLinux:
                    description: setPermissionsLinux enables setting file permissions
                      on import.
                    type: boolean
                  skipFreeSpaceCheckWhenImporting:
                    description: skipFreeSpaceCheckWhenImporting skips free space
                      check during import.
                    type: boolean
                  useScriptImport:
                    description: |-
                      useScriptImport imports with the script at scriptImportPath instead of
                      copying or hardlinking.
                    type: boolean
                type: object
              naming:
                description: naming configures episode and series naming formats.
                properties:
                  animeEpisodeFormat:
                    description: animeEpisodeFormat is the naming format for anime
                      episodes.
                    minLength: 1
                    type: string
                  colonReplacementFormat:
                    description: |-
                      colonReplacementFormat defines how colons are replaced in filenames:
                      custom uses customColonReplacementFormat.
                    enum:
                    - delete
                    - dash
                    - spaceDash
                    - spaceDashSpace
                    - smart
                    - custom
                    type: string
                  customColonReplacementFormat:
                    description: |-
                      customColonReplacementFormat replaces each colon when
                      colonReplacementFormat is custom.
                    minLength: 1
                    type: string
                  dailyEpisodeFormat:
                    description: dailyEpisodeFormat is the naming format for daily
                      episodes.
                    minLength: 1
                    type: string
                  multiEpisodeStyle:
                    description: |-
                      multiEpisodeStyle defines how multi-episode files are named: extend
                      (S01E01-02-03), duplicate (S01E01.S01E02), repeat (S01E01E02E03), scene
                      (S01E01-E02-E03), range (S01E01-03) or prefixedRange (S01E01-E03).
                    enum:
                    - extend
                    - duplicate
                    - repeat
                    - scene
                    - range
                    - prefixedRange
                    type: string
                  renameEpisodes:
                    description: renameEpisodes enables automatic episode file renaming.
                    type: boolean
                  replaceIllegalCharacters:
                    description: replaceIllegalCharacters replaces illegal characters
                      in filenames.
                    type: boolean
                  seasonFolderFormat:
                    description: seasonFolderFormat is the naming format for season
                      folders.
                    minLength: 1
                    type: string
                  seriesFolderFormat:
                    description: seriesFolderFormat is the naming format for series
                      folders.
                    minLength: 1
                    type: string
                  specialsFolderFormat:
                    description: specialsFolderFormat is the naming format for specials
                      folders.
                    minLength: 1
                    type: string
                  standardEpisodeFormat:
                    description: standardEpisodeFormat is the naming format for standard
                      episodes.
                    minLength: 1
                    type: string
                type: object
              notifications:
                description: notifications defines notification/connection configurations.
                items:
                  description: Notification defines a notification (a "Connect" entry)
                    in Sonarr, Radarr, Lidarr, Readarr or Prowlarr.
                  properties:
                    configContract:
                      description: |-
                        configContract is the configuration contract name for the implementation.
                        Defaults to "<implementation>Settings" if not set.
                      minLength: 1
                      type: string
                    fields:
                      description: fields defines the notification's configuration
                        fields (e.g., webhook URL, API token).
                      items:
                        description: |-
                          ConfigField is a named field of a provider's configuration. It sets value
                          or valueFrom, not both.
                        maxProperties: 2
                        properties:
                          name:
                            description: name is the field name.
                            minLength: 1
                            type: string
                          value:
                            description: 'value is the field value: a string, number,
                              boolean or list.'
                            x-kubernetes-preserve-unknown-fields: true
                          valueFrom:
                            description: valueFrom reads the field value from a source.
                            properties:
                              secretKeyRef:
                                description: secretKeyRef reads the value from a key
                                  of a Secret in the resource's namespace.
                                properties:
                                  key:
                                    description: key is the key within the Secret.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: name is the name of the Secret.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - secretKeyRef
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    implementation:
                      description: implementation is the notification type (e.g.,
                        Discord, Slack, Webhook, Email).
                      minLength: 1
                      type: string
                    includeHealthWarnings:
                      description: includeHealthWarnings includes health warnings
                        (not just errors) in notifications.
                      type: boolean
                    includeManualGrabs:
                      description: |-
                        includeManualGrabs also notifies of grabs made in Prowlarr's UI
                        (Prowlarr).
                      type: boolean
                    name:
                      description: name is the display name of the notification.
                      minLength: 1
                      type: string
                    onAlbumDelete:
                      description: onAlbumDelete fires when an album is deleted (Lidarr).
                      type: boolean
                    onApplicationUpdate:
                      description: onApplicationUpdate fires when the application
                        is updated.
                      type: boolean
                    onArtistAdd:
                      description: onArtistAdd fires when an artist is added (Lidarr).
                      type: boolean
                    onArtistDelete:
                      description: onArtistDelete fires when an artist is deleted
                        (Lidarr).
                      type: boolean
                    onAuthorAdded:
                      description: onAuthorAdded fires when an author is added (Readarr).
                      type: boolean
                    onAuthorDelete:
                      description: onAuthorDelete fires when an author is deleted
                        (Readarr).
                      type: boolean
                    onBookDelete:
                      description: onBookDelete fires when a book is deleted (Readarr).
                      type: boolean
                    onBookFileDelete:
                      description: onBookFileDelete fires when a book file is deleted
                        (Readarr).
                      type: boolean
                    onBookFileDeleteForUpgrade:
                      description: onBookFileDeleteForUpgrade fires when a book file
                        is deleted for an upgrade (Readarr).
                      type: boolean
                    onBookRetag:
                      description: onBookRetag fires when book file tags are rewritten
                        (Readarr).
                      type: boolean
                    onDownload:
                      description: onDownload fires when a download is imported.
                      type: boolean
                    onDownloadFailure:
                      description: onDownloadFailure fires when a download fails (Lidarr,
                        Readarr).
                      type: boolean
                    onEpisodeFileDelete:
                      description: onEpisodeFileDelete fires when an episode file
                        is deleted (Sonarr).
                      type: boolean
                    onEpisodeFileDeleteForUpgrade:
                      description: onEpisodeFileDeleteForUpgrade fires when an episode
                        file is deleted for upgrade (Sonarr).
                      type: boolean
                    onGrab:
                      description: onGrab fires when a release is grabbed (sent to
                        download client).
                      type: boolean
                    onHealthIssue:
                      description: onHealthIssue fires when a health check fails.
                      type: boolean
                    onHealthRestored:
                      description: onHealthRestored fires when a health check recovers.
                      type: boolean
                    onImportComplete:
                      description: onImportComplete fires when every file of a download
                        has been imported (Sonarr).
                      type: boolean
                    onImportFailure:
                      description: onImportFailure fires when an import fails (Lidarr,
                        Readarr).
                      type: boolean
                    onManualInteractionRequired:
                      description: onManualInteractionRequired fires when manual interaction
                        is needed.
                      type: boolean
                    onMovieAdded:
                      description: onMovieAdded fires when a new movie is added (Radarr).
                      type: boolean
                    onMovieDelete:
                      description: onMovieDelete fires when a movie is deleted (Radarr).
                      type: boolean
                    onMovieFileDelete:
                      description: onMovieFileDelete fires when a movie file is deleted
                        (Radarr).
                      type: boolean
                    onMovieFileDeleteForUpgrade:
                      description: onMovieFileDeleteForUpgrade fires when a movie
                        file is deleted for upgrade (Radarr).
                      type: boolean
                    onReleaseImport:
                      description: |-
                        onReleaseImport fires when a release is imported (Lidarr, Readarr; Sonarr
                        and Radarr call this onDownload).
                      type: boolean
                    onRename:
                      description: onRename fires when files are renamed.
                      type: boolean
                    onSeriesAdd:
                      description: onSeriesAdd fires when a new series is added (Sonarr).
                      type: boolean
                    onSeriesDelete:
                      description: onSeriesDelete fires when a series is deleted (Sonarr).
                      type: boolean
                    onTrackRetag:
                      description: onTrackRetag fires when track tags are rewritten
                        (Lidarr).
                      type: boolean
                    onUpgrade:
                      description: onUpgrade fires when an existing file is upgraded.
                      type: boolean
                    tagLabels:
                      description: |-

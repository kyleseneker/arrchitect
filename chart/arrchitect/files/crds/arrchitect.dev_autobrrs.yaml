---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.23.0
  name: autobrrs.arrchitect.dev
spec:
  group: arrchitect.dev
  names:
    categories:
    - arrchitect
    kind: Autobrr
    listKind: AutobrrList
    plural: autobrrs
    singular: autobrr
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Autobrr configures an Autobrr instance the operator connects
          to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of the Autobrr.
            properties:
              connection:
                description: connection defines how to connect to the Autobrr instance.
                properties:
                  apiKeySecretRef:
                    description: apiKeySecretRef references a Secret containing the
                      API key.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: name is the name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tls:
                    description: |-
                      tls configures TLS settings for the connection.
                      Only needed when the app uses HTTPS with self-signed or private CA certificates.
                    properties:
                      caSecretRef:
                        description: |-
                          caSecretRef references a Secret containing a PEM-encoded CA certificate bundle
                          used to verify the target app's TLS certificate.
                          The Secret must contain the CA certificate under the specified key.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            minLength: 1
                            type: string
                          name:
                            description: name is the name of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      insecureSkipVerify:
                        description: |-
                          insecureSkipVerify disables TLS certificate verification.
                          WARNING: This makes the connection susceptible to machine-in-the-middle attacks.
                          Only use for testing or when the target app uses a self-signed certificate and
                          providing a CA is not practical.
                        type: boolean
                    type: object
                  url:
                    description: url is the base URL of the app (e.g., http://sonarr.media.svc.cluster.local:8989).
                    minLength: 1
                    pattern: ^https?://
                    type: string
                required:
                - apiKeySecretRef
                - url
                type: object
              downloadClients:
                description: downloadClients defines download client connections in
                  Autobrr.
                items:
                  description: AutobrrDownloadClient defines a download client connection
                    in Autobrr.
                  properties:
                    apiKeySecretRef:
                      description: |-
                        apiKeySecretRef references a Secret containing the API key, for Sonarr, Radarr, Lidarr,
                        Readarr and SABnzbd clients.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          minLength: 1
                          type: string
                        name:
                          description: name is the name of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    appRef:
                      description: |-
                        appRef names the download client's resource, a QBittorrent, Sabnzbd,
                        Sonarr, Radarr, Lidarr or Readarr, whose kind and connection are used in
                        place of type, host, port, tls and the credentials.
                      properties:
                        group:
                          default: arrchitect.dev
                          description: group is the resource's API group.
                          enum:
                          - arrchitect.dev
                          type: string
                        kind:
                          description: kind is the resource's kind, such as Sonarr.
                          enum:
                          - Sonarr
                          - Radarr
                          - Lidarr
                          - Readarr
                          - Prowlarr
                          - Seerr
                          - Jellyfin
                          - Plex
                          - QBittorrent
                          - Sabnzbd
                          type: string
                        name:
                          description: name is the resource's name.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: a download client refers to a QBittorrent, Sabnzbd,
                          Sonarr, Radarr, Lidarr or Readarr
                        rule: self.kind in ['QBittorrent', 'Sabnzbd', 'Sonarr', 'Radarr',
                          'Lidarr', 'Readarr']
                    enabled:
                      description: |-
                        enabled controls whether this download client is active. A new download
                        client is enabled unless this is false.
                      type: boolean
                    externalDownloadClient:
                      description: |-
                        externalDownloadClient is the name of the download client in Sonarr,
                        Radarr, Lidarr, Readarr or Whisparr that releases sent through this client
                        go to, unless a filter action names another.
                      minLength: 1
                      type: string
                    host:
                      description: host is the hostname or URL of the download client.
                      minLength: 1
                      type: string
                    httpAuth:
                      description: |-
                        httpAuth is the HTTP authentication in front of the client, such as a
                        reverse proxy's. Deluge and Transmission clients don't use it.
                      properties:
                        passwordSecretRef:
                          description: passwordSecretRef references a Secret containing
                            the password.
                          properties:
                            key:
                              description: key is the key within the Secret.
                              minLength: 1
                              type: string
                            name:
                              description: name is the name of the Secret.
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        type:
                          description: type is Basic, or Digest for an rTorrent client.
                            Basic unless set.
                          enum:
                          - Basic
                          - Digest
                          type: string
                        usernameSecretRef:
                          description: usernameSecretRef references a Secret containing
                            the username.
                          properties:
                            key:
                              description: key is the key within the Secret.
                              minLength: 1
                              type: string
                            name:
                              description: name is the name of the Secret.
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - passwordSecretRef
                      - usernameSecretRef
                      type: object
                    name:
                      description: name is the display name of the download client.
                      minLength: 1
                      type: string
                    passwordSecretRef:
                      description: passwordSecretRef references a Secret containing
                        the password.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          minLength: 1
                          type: string
                        name:
                          description: name is the name of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    port:
                      description: port is the port of the download client.
                      format: int32
                      type: integer
                    rules:
                      description: rules make Autobrr skip a release while the client
                        is busy.
                      properties:
                        downloadSpeedThreshold:
                          description: |-
                            downloadSpeedThreshold is the total download speed, in KiB/s, at or above
                            which the client counts as busy. 0 doesn't check it.
                          format: int32
                          minimum: 0
                          type: integer
                        enabled:
                          description: enabled controls whether the rules apply. They
                            apply unless this is false.
                          type: boolean
                        ignoreSlowTorrents:
                          description: |-
                            ignoreSlowTorrents checks the client's transfer speeds against the
                            thresholds, sending a release only while they are below them.
                          type: boolean
                        ignoreSlowTorrentsCondition:
                          description: |-
                            ignoreSlowTorrentsCondition is when the speeds are checked: Always, for
                            every release, or MaxDownloadsReached, once maxActiveDownloads torrents
                            are downloading.
                          enum:
                          - Always
                          - MaxDownloadsReached
                          type: string
                        maxActiveDownloads:
                          description: |-
                            maxActiveDownloads is how many torrents may download at once before
                            Autobrr skips new releases. 0 means no limit.
                          format: int32
                          minimum: 0
                          type: integer
                        uploadSpeedThreshold:
                          description: |-
                            uploadSpeedThreshold is the total upload speed, in KiB/s, at or above
                            which the client counts as busy. 0 doesn't check it.
                          format: int32
                          minimum: 0
                          type: integer
                      type: object
                      x-kubernetes-validations:
                      - message: ignoreSlowTorrents needs ignoreSlowTorrentsCondition
                        rule: '!has(self.ignoreSlowTorrents) || !self.ignoreSlowTorrents
                          || has(self.ignoreSlowTorrentsCondition)'
                    tls:
                      description: tls enables TLS for the connection.
                      type: boolean
                    type:
                      description: type is the download client type. Deluge means
                        Deluge 2 (Autobrr's DELUGE_V2).
                      enum:
                      - qBittorrent
                      - Deluge
                      - Transmission
                      - rTorrent
                      - SABnzbd
                      - Sonarr
                      - Radarr
                      - Lidarr
                      - Readarr
                      - Whisparr
                      type: string
                    usernameSecretRef:
                      description: usernameSecretRef references a Secret containing
                        the username.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          minLength: 1
                          type: string
                        name:
                          description: name is the name of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: set appRef, or type and host, not both
                    rule: 'has(self.appRef) ? !has(self.type) && !has(self.host) &&
                      !has(self.port) && !has(self.tls) && !has(self.usernameSecretRef)
                      && !has(self.passwordSecretRef) && !has(self.apiKeySecretRef)
                      : has(self.type) && has(self.host)'
                  - message: only qBittorrent, Deluge and Transmission clients take
                      rules
                    rule: '!has(self.rules) || (has(self.appRef) ? self.appRef.kind
                      == ''QBittorrent'' : has(self.type) && self.type in [''qBittorrent'',
                      ''Deluge'', ''Transmission''])'
                  - message: only qBittorrent clients take the slow torrent rules
                    rule: '!has(self.rules) || !(has(self.rules.ignoreSlowTorrents)
                      || has(self.rules.ignoreSlowTorrentsCondition) || has(self.rules.downloadSpeedThreshold)
                      || has(self.rules.uploadSpeedThreshold)) || has(self.appRef)
                      || has(self.type) && self.type == ''qBittorrent'''
                  - message: Deluge and Transmission clients don't take httpAuth
                    rule: '!has(self.httpAuth) || has(self.appRef) || has(self.type)
                      && !(self.type in [''Deluge'', ''Transmission''])'
                  - message: only rTorrent clients take Digest authentication
                    rule: '!has(self.httpAuth) || !has(self.httpAuth.type) || self.httpAuth.type
                      == ''Basic'' || has(self.type) && self.type == ''rTorrent'''
                  - message: only Sonarr, Radarr, Lidarr, Readarr and Whisparr clients
                      take externalDownloadClient
                    rule: '!has(self.externalDownloadClient) || (has(self.appRef)
                      ? self.appRef.kind in [''Sonarr'', ''Radarr'', ''Lidarr'', ''Readarr'']
                      : has(self.type) && self.type in [''Sonarr'', ''Radarr'', ''Lidarr'',
                      ''Readarr'', ''Whisparr''])'
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              feeds:
                description: feeds defines RSS/Torznab feed sources.
                items:
                  description: AutobrrFeed defines an RSS or Torznab feed source.
                  properties:
                    apiKeySecretRef:
                      description: apiKeySecretRef references a Secret containing
                        the feed API key (for Torznab/Newznab).
                      properties:
                        key:
                          description: key is the key within the Secret.
                          minLength: 1
                          type: string
                        name:
                          description: name is the name of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    cookieSecretRef:
                      description: |-
                        cookieSecretRef references a Secret containing the cookie sent with feed
                        requests, for feeds behind a login.
                      properties:
                        key:
                          description: key is the key within the Secret.
                          minLength: 1
                          type: string
                        name:
                          description: name is the name of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    downloadType:
                      description: |-
                        downloadType is whether the feed's releases are fetched as Torrent files
                        or Magnet links. Some feeds need Magnet.
                      enum:
                      - Torrent
                      - Magnet
                      type: string
                    enabled:
                      description: |-
                        enabled controls whether this feed is active. A new feed is enabled unless
                        this is false.
                      type: boolean
                    indexerName:
                      description: |-
                        indexerName names the indexer this feed belongs to, a torznab, newznab
                        or rss indexer declared under indexers.
                      minLength: 1
                      type: string
                    interval:
                      description: |-
                        interval is the feed polling interval in minutes. A new feed polls every
                        15 minutes unless this is set.
                      format: int32
                      type: integer
                    maxAge:
                      description: |-
                        maxAge is the age, in seconds, past which feed items are skipped. 0
                        processes every item.
                      format: int32
                      minimum: 0
                      type: integer
                    name:
                      description: name is the display name of the feed.
                      minLength: 1
                      type: string
                    timeout:
                      description: |-
                        timeout is how long, in seconds, a feed request may take. A new feed
                        waits 60 seconds unless this is set.
                      format: int32
                      minimum: 1
                      type: integer
                    type:
                      description: type is the feed type.
                      enum:
                      - RSS
                      - Torznab
                      - Newznab
                      type: string
                    url:
                      description: url is the feed URL.
                      minLength: 1
                      type: string
                  required:
                  - indexerName
                  - name
                  - type
                  - url
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              filters:
                description: filters defines release filters with match criteria and
                  actions.
                items:
                  description: AutobrrFilter defines a release filter with match criteria
                    and actions.
                  properties:
                    actions:
                      description: actions defines what to do when a release matches
                        this filter.
                      items:
                        description: AutobrrFilterAction defines an action to take
                          when a filter matches.
                        properties:
                          category:
                            description: category overrides the download client's
                              default category.
                            minLength: 1
                            type: string
                          contentLayout:
                            description: contentLayout decides whether the torrent's
                              files go in a folder of their own.
                            enum:
                            - ORIGINAL
                            - SUBFOLDER_CREATE
                            - SUBFOLDER_NONE
                            type: string
                          downloadClientName:
                            description: |-
                              downloadClientName names the download client to use, one declared under
                              downloadClients.
                            minLength: 1
                            type: string
                          downloadPath:
                            description: downloadPath is where the download client
                              keeps the torrent while it downloads.
                            minLength: 1
                            type: string
                          enabled:
                            description: |-
                              enabled controls whether this action is active. A new action is enabled
                              unless this is false.
                            type: boolean
                          execArgs:
                            description: execArgs is the arguments for the exec command.
                            minLength: 1
                            type: string
                          execCommand:
                            description: execCommand is the command to execute (for
                              Exec action type).
                            minLength: 1
                            type: string
                          externalDownloadClient:
                            description: |-
                              externalDownloadClient is the download client, by name in Sonarr, Radarr, Lidarr or Readarr,
                              that the app sends the release to.
                            minLength: 1
                            type: string
                          firstLastPiecePrio:
                            description: firstLastPiecePrio downloads the first and
                              last pieces first.
                            type: boolean
                          ignoreRules:
                            description: ignoreRules sends the release even when the
                              download client is past its limits.
                            type: boolean
                          label:
                            description: label is the label the download client gives
                              the torrent.
                            minLength: 1
                            type: string
                          limitDownloadSpeed:
                            description: limitDownloadSpeed caps the torrent's download
                              speed, in KiB/s.
                            format: int32
                            minimum: 0
                            type: integer
                          limitRatio:
                            description: limitRatio is the share ratio at which the
                              torrent stops seeding.
                            minimum: 0
                            type: number
                          limitSeedTime:
                            description: limitSeedTime is how many minutes the torrent
                              seeds.
                            format: int32
                            minimum: 0
                            type: integer
                          limitUploadSpeed:
                            description: limitUploadSpeed caps the torrent's upload
                              speed, in KiB/s.
                            format: int32
                            minimum: 0
                            type: integer
                          name:
                            description: name is the display name of the action.
                            minLength: 1
                            type: string
                          paused:
                            description: paused adds the torrent paused.
                            type: boolean
                          priority:
                            description: priority is where the torrent goes in the
                              download client's queue.
                            enum:
                            - MAX
                            - MIN
                            - LOW
                            - NORMAL
                            - HIGH
                            type: string
                          reannounceDelete:
                            description: reannounceDelete removes the torrent if it
                              never announces.
                            type: boolean
                          reannounceInterval:
                            description: reannounceInterval is how many seconds to
                              wait between reannounce attempts.
                            format: int32
                            minimum: 1
                            type: integer
                          reannounceMaxAttempts:
                            description: reannounceMaxAttempts is how many times to
                              reannounce.
                            format: int32
                            minimum: 1
                            type: integer
                          reannounceSkip:
                            description: reannounceSkip adds the torrent without waiting
                              for it to announce.
                            type: boolean
                          savePath:
                            description: savePath overrides the download client's
                              default save path.
                            minLength: 1
                            type: string
                          skipHashCheck:
                            description: skipHashCheck adds the torrent without checking
                              existing data.
                            type: boolean
                          tags:
                            description: tags is a comma-separated list of tags the
                              download client gives the torrent.
                            minLength: 1
                            type: string
                          type:
                            description: type is the action type. Deluge means Deluge
                              2 (Autobrr's DELUGE_V2).
                            enum:
                            - qBittorrent
                            - Deluge
                            - Transmission
                            - rTorrent
                            - SABnzbd
                            - Sonarr
                            - Radarr
                            - Lidarr
                            - Readarr
                            - Whisparr
                            - Webhook
                            - Exec
                            - WatchFolder
                            type: string
                          watchFolder:
                            description: watchFolder is the folder path (for WatchFolder
                              action type).
                            minLength: 1
                            type: string
                          webhookData:
                            description: webhookData is the body the webhook sends;
                              Autobrr fills in its macros.
                            minLength: 1
                            type: string
                          webhookHeaders:
                            description: webhookHeaders are headers the webhook sends,
                              as Name=Value.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: set
                          webhookMethod:
                            description: webhookMethod is the HTTP method the webhook
                              uses.
                            enum:
                            - GET
                            - POST
                            - PUT
                            - PATCH
                            - DELETE
                            type: string
                          webhookType:
                            description: webhookType is the content type the webhook
                              sends, such as JSON.
                            minLength: 1
                            type: string
                          webhookUrl:
                            description: webhookUrl is the webhook URL (for Webhook
                              action type).
                            minLength: 1
                            type: string
                        required:
                        - name
                        - type
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    albums:
                      description: albums is a comma-separated list of albums to match.
                      minLength: 1
                      type: string
                    announceTypes:
                      description: announceTypes is a list of announce types to match,
                        such as NEW or PROMO.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    artists:
                      description: artists is a comma-separated list of artists to
                        match.
                      minLength: 1
                      type: string
                    codecs:
                      description: codecs is a list of acceptable codecs (e.g., "x264",
                        "x265", "HEVC").
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    containers:
                      description: containers is a list of acceptable containers,
                        such as mkv.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    cue:
                      description: cue matches only releases with a cue file.
                      type: boolean
                    days:
                      description: days is a comma-separated list of days to match.
                      minLength: 1
                      type: string
                    delay:
                      description: delay is the delay in seconds before grabbing a
                        matched release.
                      format: int32
                      type: integer
                    enabled:
                      description: |-
                        enabled controls whether this filter is active. A new filter is enabled
                        unless this is false.
                      type: boolean
                    episodes:
                      description: episodes is a comma-separated list of episodes
                        or ranges to match.
                      minLength: 1
                      type: string
                    exceptCategories:
                      description: exceptCategories is a comma-separated list of categories
                        to skip.
                      minLength: 1
                      type: string
                    exceptDescription:
                      description: exceptDescription is a comma-separated list of
                        description patterns to skip.
                      minLength: 1
                      type: string
                    exceptHdr:
                      description: exceptHdr is a list of HDR formats to skip.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    exceptLanguage:
                      description: exceptLanguage is a list of languages to skip.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    exceptOrigins:
                      description: exceptOrigins is a list of origins to skip.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    exceptOther:
                      description: exceptOther is a list of other release attributes
                        to skip.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    exceptReleaseGroups:
                      description: exceptReleaseGroups is a comma-separated list of
                        release groups to skip.
                      minLength: 1
                      type: string
                    exceptReleaseTags:
                      description: exceptReleaseTags is a comma-separated list of
                        release tags to skip.
                      minLength: 1
                      type: string
                    exceptReleaseTypes:
                      description: exceptReleaseTypes is a comma-separated list of
                        music release types to skip.
                      minLength: 1
                      type: string
                    exceptReleases:
                      description: exceptReleases is a comma-separated list of release
                        name patterns to exclude.
                      minLength: 1
                      type: string
                    exceptTags:
                      description: exceptTags is a list of tags to skip.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    exceptTagsMatchLogic:
                      description: exceptTagsMatchLogic decides whether any or all
                        of exceptTags skip a release.
                      enum:
                      - ANY
                      - ALL
                      type: string
                    exceptUploaders:
                      description: exceptUploaders is a comma-separated list of uploaders
                        to skip.
                      minLength: 1
                      type: string
                    formats:
                      description: formats is a list of audio formats to match, such
                        as FLAC or MP3.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    freeleech:
                      description: freeleech matches only freeleech releases.
                      type: boolean
                    freeleechPercent:
                      description: freeleechPercent is the freeleech percentages to
                        match, such as 50%,75%-100%.
                      minLength: 1
                      type: string
                    indexers:
                      description: |-
                        indexers lists the indexers, by name, whose releases this filter checks.
                        Autobrr checks a filter only against the indexers it lists.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    log:
                      description: log matches only releases with a rip log.
                      type: boolean
                    logScore:
                      description: logScore is the lowest rip log score to match.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    matchCategories:
                      description: matchCategories is a comma-separated list of categories
                        to match.
                      minLength: 1
                      type: string
                    matchDescription:
                      description: matchDescription is a comma-separated list of description
                        patterns to match.
                      minLength: 1
                      type: string
                    matchHdr:
                      description: matchHdr is a list of HDR formats to match, such
                        as DV or HDR10+.
                      items:
                        type: string
                      type: array

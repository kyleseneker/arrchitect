---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.23.0
  name: plexes.arrchitect.dev
spec:
  group: arrchitect.dev
  names:
    categories:
    - arrchitect
    kind: Plex
    listKind: PlexList
    plural: plexes
    singular: plex
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Plex configures a Plex instance the operator connects to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of the Plex.
            properties:
              connection:
                description: connection defines how to connect to the Plex instance.
                properties:
                  tls:
                    description: |-
                      tls configures TLS settings for the connection.
                      Only needed when Plex uses HTTPS with self-signed or private CA certificates.
                    properties:
                      caSecretRef:
                        description: |-
                          caSecretRef references a Secret containing a PEM-encoded CA certificate bundle
                          used to verify the target app's TLS certificate.
                          The Secret must contain the CA certificate under the specified key.
                        properties:
                          key:
                            description: key is the key within the Secret.
                            type: string
                          name:
                            description: name is the name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      insecureSkipVerify:
                        description: |-
                          insecureSkipVerify disables TLS certificate verification.
                          WARNING: This makes the connection susceptible to machine-in-the-middle attacks.
                          Only use for testing or when the target app uses a self-signed certificate and
                          providing a CA is not practical.
                        type: boolean
                    type: object
                  tokenSecretRef:
                    description: tokenSecretRef references a Secret containing the
                      X-Plex-Token.
                    properties:
                      key:
                        description: key is the key within the Secret.
                        type: string
                      name:
                        description: name is the name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  url:
                    description: url is the base URL of the Plex server (e.g., http://plex:32400).
                    pattern: ^https?://
                    type: string
                required:
                - tokenSecretRef
                - url
                type: object
              libraries:
                description: |-
                  libraries defines media libraries, matched by name. An existing library
                  keeps the declared agent, scanner, language and folders: folders it
                  doesn't list are removed. Libraries are never deleted, and a library's
                  type can't change in place.
                items:
                  description: PlexLibrary defines a Plex media library.
                  properties:
                    agent:
                      description: agent is the metadata agent to use.
                      type: string
                    language:
                      description: language is the library language (ISO 639-1).
                      type: string
                    name:
                      description: name is the display name of the library.
                      type: string
                    paths:
                      description: paths is the list of media folder paths.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                    scanner:
                      description: scanner is the scanner type.
                      type: string
                    type:
                      description: type is the library type.
                      enum:
                      - movie
                      - show
                      - artist
                      - photo
                      type: string
                  required:
                  - name
                  - paths
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              network:
                description: network configures network settings.
                properties:
                  allowedNetworks:
                    description: allowedNetworks is a comma-separated list of networks
                      allowed without auth.
                    type: string
                  customServerAccessUrls:
                    description: customServerAccessUrls is a comma-separated list
                      of custom access URLs.
                    type: string
                  enableIPv6:
                    description: enableIPv6 enables IPv6 support.
                    type: boolean
                  gdmEnabled:
                    description: gdmEnabled announces the server to clients on the
                      local network.
                    type: boolean
                  manualPortMappingMode:
                    description: |-
                      manualPortMappingMode uses manualPortMappingPort as the public port for
                      remote access instead of finding one.
                    type: boolean
                  manualPortMappingPort:
                    description: manualPortMappingPort is the public port for remote
                      access.
                    maximum: 65535
                    minimum: 1
                    type: integer
                  preferredNetworkInterface:
                    description: |-
                      preferredNetworkInterface is the interface Plex uses, such as eth0. An
                      empty string means any.
                    type: string
                  relayEnabled:
                    description: relayEnabled lets clients that can't connect directly
                      go through Plex's relay.
                    type: boolean
                  secureConnections:
                    description: |-
                      secureConnections controls whether clients must, should or can't use
                      secure connections.
                    enum:
                    - required
                    - preferred
                    - disabled
                    type: string
                  webhooksEnabled:
                    description: webhooksEnabled sends events to the webhooks set
                      up in the Plex account.
                    type: boolean
                type: object
              reconcile:
                description: reconcile configures reconciliation behavior (e.g., sync
                  interval).
                properties:
                  deletionPolicy:
                    description: |-
                      deletionPolicy controls what happens to resources in the app when this CR
                      is deleted. "orphan" leaves them in place, "delete" removes the resources
                      the operator created.
                      Default: orphan.
                    enum:
                    - orphan
                    - delete
                    type: string
                  driftPolicy:
                    description: |-
                      driftPolicy controls whether drift is corrected or only recorded.
                      "enforce" rewrites a resource whose live state differs from this CR.
                      "observe" leaves the app untouched and only counts the difference, which
                      makes drift measurable before handing the operator write authority.
                      Default: enforce.
                    enum:
                    - enforce
                    - observe
                    type: string
                  intervalSeconds:
                    description: |-
                      intervalSeconds is how often the operator reconciles, in seconds.
                      Defaults to 300, and is at least 30.
                    format: int32
                    minimum: 30
                    type: integer
                  prune:
                    description: |-
                      prune deletes resources the operator created, tracked in
                      status.managedResources, once they are removed from this spec. Resources
                      it did not create are never deleted, and a resource type with nothing
                      declared is left alone. Root folders and tags are never pruned.
                      Not every integration supports prune; one that does not rejects it with
                      InvalidConfig rather than ignoring it.
                      Default: false (only create/update, never delete).
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: deletionPolicy delete conflicts with driftPolicy observe
                  rule: '!has(self.deletionPolicy) || self.deletionPolicy != ''delete''
                    || !has(self.driftPolicy) || self.driftPolicy != ''observe'''
              server:
                description: server configures Plex server settings.
                properties:
                  allowMediaDeletion:
                    description: allowMediaDeletion lets the server owner delete media
                      from Plex apps.
                    type: boolean
                  autoEmptyTrash:
                    description: autoEmptyTrash automatically empties the trash.
                    type: boolean
                  butlerDatabaseBackupPath:
                    description: butlerDatabaseBackupPath is where database backups
                      go.
                    type: string
                  butlerEndHour:
                    description: butlerEndHour is the hour scheduled maintenance tasks
                      must stop.
                    maximum: 23
                    minimum: 0
                    type: integer
                  butlerStartHour:
                    description: butlerStartHour is the hour scheduled maintenance
                      tasks may start.
                    maximum: 23
                    minimum: 0
                    type: integer
                  butlerTaskBackupDatabase:
                    description: butlerTaskBackupDatabase backs up the database every
                      three days.
                    type: boolean
                  butlerTaskCleanOldBundles:
                    description: butlerTaskCleanOldBundles removes old metadata bundles
                      every week.
                    type: boolean
                  butlerTaskCleanOldCacheFiles:
                    description: butlerTaskCleanOldCacheFiles removes old cache files
                      every week.
                    type: boolean
                  butlerTaskDeepMediaAnalysis:
                    description: butlerTaskDeepMediaAnalysis analyzes media in depth
                      during maintenance.
                    type: boolean
                  butlerTaskOptimizeDatabase:
                    description: butlerTaskOptimizeDatabase optimizes the database
                      every week.
                    type: boolean
                  butlerTaskRefreshLibraries:
                    description: butlerTaskRefreshLibraries scans the libraries during
                      maintenance.
                    type: boolean
                  butlerTaskRefreshLocalMedia:
                    description: butlerTaskRefreshLocalMedia refreshes local metadata
                      every three days.
                    type: boolean
                  butlerTaskRefreshPeriodicMetadata:
                    description: butlerTaskRefreshPeriodicMetadata refreshes metadata
                      periodically.
                    type: boolean
                  butlerTaskUpgradeMediaAnalysis:
                    description: butlerTaskUpgradeMediaAnalysis upgrades media analysis
                      during maintenance.
                    type: boolean
                  dlnaEnabled:
                    description: dlnaEnabled runs the DLNA server.
                    type: boolean
                  enableRemoteAccess:
                    description: enableRemoteAccess allows access from outside the
                      local network.
                    type: boolean
                  friendlyName:
                    description: friendlyName is the server's display name.
                    type: string
                  generateChapterThumbnails:
                    description: generateChapterThumbnails is when Plex makes chapter
                      thumbnails.
                    enum:
                    - never
                    - scheduled
                    - asap
                    type: string
                  generateVideoPreviewThumbnails:
                    description: |-
                      generateVideoPreviewThumbnails is when Plex makes the thumbnails shown
                      while seeking: never, as a scheduled task, or also as media is added.
                    enum:
                    - never
                    - scheduled
                    - asap
                    type: string
                  libraryScanInterval:
                    description: libraryScanInterval is how often, in seconds, scanMyLibraryPeriodically
                      scans.
                    enum:
                    - 900
                    - 1800
                    - 3600
                    - 7200
                    - 21600
                    - 43200
                    - 86400
                    type: integer
                  logDebug:
                    description: logDebug enables debug logging.
                    type: boolean
                  logVerbose:
                    description: logVerbose enables verbose logging.
                    type: boolean
                  loudnessAnalysis:
                    description: loudnessAnalysis is when Plex analyzes audio loudness.
                    enum:
                    - never
                    - scheduled
                    - asap
                    type: string
                  scanMyLibraryAutomatically:
                    description: scanMyLibraryAutomatically enables automatic library
                      scanning.
                    type: boolean
                  scanMyLibraryPartially:
                    description: |-
                      scanMyLibraryPartially scans only the folders that changed when changes
                      are detected.
                    type: boolean
                  scanMyLibraryPeriodically:
                    description: scanMyLibraryPeriodically enables periodic library
                      scanning.
                    type: boolean
                  scannerLowPriority:
                    description: scannerLowPriority runs scans at a lower priority.
                    type: boolean
                  sendCrashReports:
                    description: sendCrashReports sends crash reports to Plex.
                    type: boolean
                  videoPlayedThreshold:
                    description: videoPlayedThreshold is how far, in percent, a video
                      must play to count as watched.
                    enum:
                    - 70
                    - 75
                    - 80
                    - 85
                    - 90
                    - 95
                    type: integer
                type: object
              transcoder:
                description: transcoder configures transcoding and hardware acceleration.
                properties:
                  downloadsTempDirectory:
                    description: downloadsTempDirectory is where transcodes for downloads
                      are kept.
                    type: string
                  hardwareAccelerationType:
                    description: hardwareAccelerationType sets the HW acceleration
                      type.
                    type: string
                  maxSimultaneousVideoTranscodes:
                    description: maxSimultaneousVideoTranscodes limits concurrent
                      transcodes. 0 = unlimited.
                    type: integer
                  transcodeHwEncodingEnabled:
                    description: transcodeHwEncodingEnabled enables hardware encoding.
                    type: boolean
                  transcodeHwRequested:
                    description: transcodeHwRequested enables hardware-accelerated
                      transcoding.
                    type: boolean
                  transcoderH264BackgroundPreset:
                    description: |-
                      transcoderH264BackgroundPreset is the encoder preset for background
                      transcodes such as optimizing and downloads.
                    enum:
                    - ultrafast
                    - superfast
                    - veryfast
                    - faster
                    - fast
                    - medium
                    - slow
                    - slower
                    - veryslow
                    type: string
                  transcoderHevcEncoding:
                    description: transcoderHevcEncoding allows HEVC encoding.
                    type: boolean
                  transcoderQuality:
                    description: |-
                      transcoderQuality trades encoding speed for quality. maximumQuality is
                      what Plex calls "make my CPU hurt".
                    enum:
                    - automatic
                    - preferSpeed
                    - preferQuality
                    - maximumQuality
                    type: string
                  transcoderTempDirectory:
                    description: transcoderTempDirectory sets the transcoder temporary
                      directory.
                    type: string
                  transcoderThrottleBuffer:
                    description: |-
                      transcoderThrottleBuffer is how many seconds ahead of playback the
                      transcoder works before slowing down.
                    minimum: 0
                    type: integer
                type: object
            required:
            - connection
            type: object
            x-kubernetes-validations:
            - message: Plex doesn't support prune
              rule: '!has(self.reconcile) || !has(self.reconcile.prune) || !self.reconcile.prune'
            - message: Plex doesn't support deletionPolicy delete
              rule: '!has(self.reconcile) || !has(self.reconcile.deletionPolicy) ||
                self.reconcile.deletionPolicy != ''delete'''
          status:
            description: status is the observed state of the Plex.
            properties:
              conditions:
                description: conditions represent the current state of the Plex resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: lastSyncTime is the timestamp of the last successful
                  reconciliation.
                format: date-time
                type: string
              managedResources:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: |-
                  managedResources records the resources this operator created, keyed by
                  resource type. Prune only removes entries listed here, so resources
                  created outside the operator are never deleted.
                type: object
              observedGeneration:
                description: observedGeneration is the most recent generation observed.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

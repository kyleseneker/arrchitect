apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "arrchitect.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arrchitect.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
{{- range $ns := splitList "," (include "arrchitect.watchNamespaces" .) }}
{{- with $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "arrchitect.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "arrchitect.labels" $ | nindent 4 }}
rules:
  {{- include "arrchitect.managerRules" $ | nindent 2 }}
{{- end }}
{{- end }}

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "arrchitect.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arrchitect.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "arrchitect.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- range $ns := splitList "," (include "arrchitect.watchNamespaces" .) }}
{{- with $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "arrchitect.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "arrchitect.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "arrchitect.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.serviceAccount.name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}

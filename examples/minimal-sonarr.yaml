# Adds a root folder to Sonarr. Apply it to check that the operator works.
---
apiVersion: v1
kind: Secret
metadata:
  name: sonarr-credentials
  namespace: media
type: Opaque
stringData:
  api-key: "your-sonarr-api-key"
---
apiVersion: arrchitect.dev/v1alpha1
kind: Sonarr
metadata:
  name: sonarr
  namespace: media
spec:
  connection:
    url: http://sonarr.media.svc.cluster.local:8989
    apiKeySecretRef:
      name: sonarr-credentials
      key: api-key
  rootFolders:
    - path: /data/media/tv

# Secrets for every app in the examples.
# Replace the values with your credentials; stringData takes them as plain text.
# In production, use a tool like Sealed Secrets or External Secrets.
---
apiVersion: v1
kind: Secret
metadata:
  name: sonarr-credentials
  namespace: media
type: Opaque
stringData:
  api-key: "your-sonarr-api-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: radarr-credentials
  namespace: media
type: Opaque
stringData:
  api-key: "your-radarr-api-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: prowlarr-credentials
  namespace: media
type: Opaque
stringData:
  api-key: "your-prowlarr-api-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: qbittorrent-credentials
  namespace: media
type: Opaque
stringData:
  username: "admin"
  password: "your-qbittorrent-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: jellyfin-credentials
  namespace: media
type: Opaque
stringData:
  username: "admin"
  password: "your-jellyfin-password"
  # From Dashboard > API Keys, once Jellyfin is set up.
  api-key: "your-jellyfin-api-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: plex-credentials
  namespace: media
type: Opaque
stringData:
  token: "your-plex-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: seedbox-credentials
  namespace: media
type: Opaque
stringData:
  username: "your-seedbox-username"
  password: "your-seedbox-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: usenet-indexer-credentials
  namespace: media
type: Opaque
stringData:
  api-key: "your-usenet-indexer-api-key"

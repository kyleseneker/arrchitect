# Common homelab stack: Sonarr + Radarr + Prowlarr + qBittorrent + Plex + Seerr
# This is the Plex-based variant (vs Jellyfin). Adjust URLs to match your cluster.
#
# Prerequisites:
#   - Apps deployed and accessible at the URLs below (see docs/example-stack.md)
#   - Secrets created (see secrets.yaml)
#   - Arrchitect installed:
#     helm install arrchitect oci://ghcr.io/kyleseneker/charts/arrchitect
---
apiVersion: arrchitect.dev/v1alpha1
kind: Sonarr
metadata:
  name: sonarr
  namespace: media
spec:
  connection:
    url: http://sonarr.media.svc.cluster.local:8989
    apiKeySecretRef:
      name: sonarr-credentials
      key: api-key
  mediaManagement:
    copyUsingHardlinks: true
    deleteEmptyFolders: true
  naming:
    renameEpisodes: true
    replaceIllegalCharacters: true
    standardEpisodeFormat: "{Series TitleYear} - S{season:00}E{episode:00} - {Episode CleanTitle} [{Quality Full}]"
    seriesFolderFormat: "{Series TitleYear}"
    seasonFolderFormat: "Season {season:00}"
  rootFolders:
    - path: /data/media/tv
---
apiVersion: arrchitect.dev/v1alpha1
kind: SonarrDownloadClient
metadata:
  name: sonarr-qbittorrent
  namespace: media
spec:
  sonarrRef:
    name: sonarr
  name: qBittorrent
  appRef:
    kind: QBittorrent
    name: qbittorrent
  category: tv-sonarr
---
apiVersion: arrchitect.dev/v1alpha1
kind: Radarr
metadata:
  name: radarr
  namespace: media
spec:
  connection:
    url: http://radarr.media.svc.cluster.local:7878
    apiKeySecretRef:
      name: radarr-credentials
      key: api-key
  mediaManagement:
    copyUsingHardlinks: true
    deleteEmptyFolders: true
  naming:
    renameMovies: true
    replaceIllegalCharacters: true
    standardMovieFormat: "{Movie CleanTitle} {(Release Year)} [{Quality Full}]"
    movieFolderFormat: "{Movie CleanTitle} ({Release Year})"
  rootFolders:
    - path: /data/media/movies
---
apiVersion: arrchitect.dev/v1alpha1
kind: RadarrDownloadClient
metadata:
  name: radarr-qbittorrent
  namespace: media
spec:
  radarrRef:
    name: radarr
  name: qBittorrent
  appRef:
    kind: QBittorrent
    name: qbittorrent
  category: radarr
---
apiVersion: arrchitect.dev/v1alpha1
kind: Prowlarr
metadata:
  name: prowlarr
  namespace: media
spec:
  connection:
    url: http://prowlarr.media.svc.cluster.local:9696
    apiKeySecretRef:
      name: prowlarr-credentials
      key: api-key
  applications:
    - name: Sonarr
      appRef:
        kind: Sonarr
        name: sonarr
      syncLevel: fullSync
      syncCategories: [5000, 5010, 5020, 5030, 5040, 5045, 5050]
    - name: Radarr
      appRef:
        kind: Radarr
        name: radarr
      syncLevel: fullSync
      syncCategories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080]
---
apiVersion: arrchitect.dev/v1alpha1
kind: QBittorrent
metadata:
  name: qbittorrent
  namespace: media
spec:
  connection:
    url: http://qbittorrent.media.svc.cluster.local:8080
    usernameSecretRef:
      name: qbittorrent-credentials
      key: username
    passwordSecretRef:
      name: qbittorrent-credentials
      key: password
  preferences:
    savePath: /data/torrents
    maxRatioEnabled: true
    maxRatio: "2.0"
  categories:
    - name: tv-sonarr
      savePath: /data/torrents/tv
    - name: radarr
      savePath: /data/torrents/movies
---
apiVersion: arrchitect.dev/v1alpha1
kind: Plex
metadata:
  name: plex
  namespace: media
spec:
  connection:
    url: http://plex.media.svc.cluster.local:32400
    tokenSecretRef:
      name: plex-credentials
      key: token
  server:
    friendlyName: "Homelab Media"
    scanMyLibraryAutomatically: true
    scanMyLibraryPeriodically: true
    autoEmptyTrash: true
  transcoder:
    transcodeHwRequested: true
    hardwareAccelerationType: vaapi
  libraries:
    - name: Movies
      type: movie
      paths:
        - /data/media/movies
    - name: TV Shows
      type: show
      paths:
        - /data/media/tv
---
apiVersion: arrchitect.dev/v1alpha1
kind: Seerr
metadata:
  name: seerr
  namespace: media
spec:
  connection:
    url: http://seerr.media.svc.cluster.local:5055
  plexAuth:
    appRef:
      kind: Plex
      name: plex
  main:
    applicationTitle: "Media Requests"
    hideAvailable: false
    localLogin: true
  sonarr:
    - name: Sonarr
      appRef:
        kind: Sonarr
        name: sonarr
      isDefault: true
      enableSeasonFolders: true
      activeDirectory: /data/media/tv
  radarr:
    - name: Radarr
      appRef:
        kind: Radarr
        name: radarr
      isDefault: true
      minimumAvailability: released
      activeDirectory: /data/media/movies

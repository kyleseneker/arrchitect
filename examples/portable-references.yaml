# Refers to tags and Prowlarr sync profiles by name and maps a seedbox's download paths.
# Supply the referenced Secrets and deploy the apps separately.
# The hostname and local directories below must exist in your installation.
---
apiVersion: arrchitect.dev/v1alpha1
kind: Sonarr
metadata:
  name: portable-sonarr
  namespace: media
spec:
  connection:
    url: http://sonarr.media.svc.cluster.local:8989
    apiKeySecretRef:
      name: sonarr-credentials
      key: api-key
  tags:
    - label: television
  remotePathMappings:
    - host: seedbox.example.com
      remotePath: /downloads/tv
      localPath: /data/seedbox/tv
---
apiVersion: arrchitect.dev/v1alpha1
kind: SonarrDownloadClient
metadata:
  name: portable-sonarr-seedbox
  namespace: media
spec:
  sonarrRef:
    name: portable-sonarr
  name: seedbox
  implementation: QBittorrent
  protocol: torrent
  host: seedbox.example.com
  port: 8080
  category: tv
  tagLabels: [television]
  usernameSecretRef:
    name: seedbox-credentials
    key: username
  passwordSecretRef:
    name: seedbox-credentials
    key: password
---
apiVersion: arrchitect.dev/v1alpha1
kind: Prowlarr
metadata:
  name: portable-prowlarr
  namespace: media
spec:
  connection:
    url: http://prowlarr.media.svc.cluster.local:9696
    apiKeySecretRef:
      name: prowlarr-credentials
      key: api-key
  appProfiles:
    - name: Automatic and interactive
      enableRss: true
      enableAutomaticSearch: true
      enableInteractiveSearch: true
      minimumSeeders: 1
  indexers:
    - name: Usenet Indexer
      implementation: Newznab
      enable: true
      appProfileName: Automatic and interactive
      fields:
        - name: baseUrl
          value: https://indexer.example.com
        - name: apiKey
          valueFrom:
            secretKeyRef:
              name: usenet-indexer-credentials
              key: api-key

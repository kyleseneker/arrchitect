# Example: per-resource reconcile interval and pruning.
# Useful when some apps change config more often than others,
# or when you want to reduce API calls to a slow or overloaded app.
#
# prune: true deletes items the operator created once you remove them from the resource.
# For example, remove a notification the operator added and it is deleted from the app.
# Anything created by hand is never deleted, root folders and tags are never pruned,
# and a section left out isn't managed. The API server rejects prune: true on apps
# that can't prune; see docs/guide.md for which ones can.
---
apiVersion: arrchitect.dev/v1alpha1
kind: Sonarr
metadata:
  name: sonarr
  namespace: media
spec:
  connection:
    url: http://sonarr.media.svc.cluster.local:8989
    apiKeySecretRef:
      name: sonarr-credentials
      key: api-key
  # Check every 10 minutes instead of the default 5, enable pruning
  reconcile:
    intervalSeconds: 600
    prune: true
  rootFolders:
    - path: /data/media/tv
---
apiVersion: arrchitect.dev/v1alpha1
kind: Jellyfin
metadata:
  name: jellyfin
  namespace: media
spec:
  connection:
    url: http://jellyfin.media.svc.cluster.local:8096
  adminUser:
    usernameSecretRef:
      name: jellyfin-credentials
      key: username
    passwordSecretRef:
      name: jellyfin-credentials
      key: password
  # Jellyfin config rarely changes, check every 30 minutes
  reconcile:
    intervalSeconds: 1800
  server:
    serverName: Homelab Media
  libraries:
    - name: Movies
      collectionType: movies
      paths:
        - /data/media/movies

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-release-${{ runner.os }}-
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: List CRDs changed since the previous tag
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^") || exit 0
          crds=$(git diff --name-only --diff-filter=d --relative=config/crd/bases "$prev" "$GITHUB_REF_NAME" \
            | sed 's/^arrchitect\.dev_//; s/\.yaml$//' | paste -sd' ' -)
          if [ -n "$crds" ]; then echo "CHANGED_CRDS=$crds" >> "$GITHUB_ENV"; fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update chart version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version:.*/version: ${VERSION}/" chart/arrchitect/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" chart/arrchitect/Chart.yaml
          sed -i "s|image: ghcr.io/kyleseneker/arrchitect:.*|image: ghcr.io/kyleseneker/arrchitect:${VERSION}|" chart/arrchitect/Chart.yaml
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package, push and sign Helm chart
        run: |
          helm package chart/arrchitect
          pushed=$(helm push arrchitect-*.tgz oci://ghcr.io/kyleseneker/charts 2>&1) || { echo "$pushed"; exit 1; }
          echo "$pushed"
          digest=$(echo "$pushed" | awk '/^Digest:/ {print $2}')
          test -n "$digest"
          cosign sign --yes "ghcr.io/kyleseneker/charts/arrchitect@${digest}"
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
      - name: Push Artifact Hub repository metadata
        working-directory: chart
        run: |
          oras push ghcr.io/kyleseneker/charts/arrchitect:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

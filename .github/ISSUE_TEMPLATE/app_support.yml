name: Support a new app
description: Ask for a new app, or new settings on an app that's already supported
labels: [enhancement]
body:
  - type: input
    id: app
    attributes:
      label: App
      description: Name and a link to it.
      placeholder: "Example: https://github.com/example/app"
    validations:
      required: true

  - type: input
    id: api-docs
    attributes:
      label: API docs
      description: >
        A link to its API reference or OpenAPI spec. Without one, the endpoints
        you found in the web UI's network requests.

  - type: textarea
    id: settings
    attributes:
      label: What should be manageable
      description: >
        Which settings do you want in git? Name them. Most of these apps have
        hundreds of settings and only a dozen matter.
    validations:
      required: true

  - type: input
    id: auth
    attributes:
      label: How does it authenticate?
      description: API key header, bearer token, session cookie or something else?

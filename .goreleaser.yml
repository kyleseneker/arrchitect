version: 2

builds:
  - id: media-operator
    main: ./cmd/operator
    binary: media-operator-operator
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"]
  - id: media-operator-cli
    main: ./cmd/cli
    binary: media-operator
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"]

dockers_v2:
  - id: media-operator
    ids: [media-operator]
    images: [ghcr.io/kyleseneker/media-operator]
    tags: ["{{ .Version }}", latest]
    platforms: [linux/amd64, linux/arm64]
    sbom: "{{ not .IsSnapshot }}"
    build_args:
      BINARY: media-operator-operator
    annotations: &image-annotations
      "org.opencontainers.image.source": https://github.com/kyleseneker/media-operator
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.licenses": Apache-2.0
      "org.opencontainers.image.base.name": "{{ .BaseImage }}"
      "org.opencontainers.image.base.digest": "{{ .BaseImageDigest }}"
      "org.opencontainers.image.description": Configures Sonarr, Radarr, Prowlarr, Jellyfin, Plex and other media apps from Kubernetes resources
  - id: media-operator-cli
    ids: [media-operator-cli]
    images: [ghcr.io/kyleseneker/media-operator-cli]
    tags: ["{{ .Version }}", latest]
    platforms: [linux/amd64, linux/arm64]
    sbom: "{{ not .IsSnapshot }}"
    build_args:
      BINARY: media-operator
    annotations:
      <<: *image-annotations
      "org.opencontainers.image.description": media-operator's command line tool, which exports an app's configuration as a config resource

docker_signs:
  - cmd: cosign
    args: ["sign", "--yes", "${artifact}@${digest}"]

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]

archives:
  - id: operator
    ids: [media-operator]
    formats: ['tar.gz']
  - id: cli
    ids: [media-operator-cli]
    name_template: "media-operator-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']

changelog:
  sort: asc
  abbrev: 7
  format: '{{ .SHA }} {{ replace (replace .Message "<" "&lt;") ">" "&gt;" }}'
  filters:
    include:
      - '^.*?\w+(\([^)]*\))?!:.+$'
      - '^.*?(feat|fix)(\([^)]*\))?:.+$'
      - '^.*?chore\(deps\):.+$'
  groups:
    - title: Breaking changes
      regexp: '^.*?\w+(\([^)]*\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([^)]*\))?:.+$'
      order: 1
    - title: Fixes
      regexp: '^.*?fix(\([^)]*\))?:.+$'
      order: 2
    - title: Dependencies
      regexp: '^.*?chore\(deps\):.+$'
      order: 3

release:
  name_template: "{{ .TagSubject }}"
  header: |
    {{ with .TagBody }}## Upgrade notes

    {{ . }}
    {{ end }}
  footer: |
    {{ if isEnvSet "CHANGED_CRDS" }}## CRD changes

    The chart installs and upgrades the CRDs of the apps it runs. With `crds.enabled: false`, apply the changed ones yourself before upgrading:

    ```bash
    for crd in {{ .Env.CHANGED_CRDS }}; do
      kubectl apply --server-side --force-conflicts -f https://github.com/kyleseneker/media-operator/releases/download/{{ .Tag }}/media-operator.dev_${crd}.yaml
    done
    ```
    {{ end }}
    ## Install

    - Chart: `oci://ghcr.io/kyleseneker/charts/media-operator`, version `{{ .Version }}`
    - Image: `ghcr.io/kyleseneker/media-operator:{{ .Version }}`
    - CLI: the `media-operator-cli` archives below, or `ghcr.io/kyleseneker/media-operator-cli:{{ .Version }}`
    - Tested app versions: [supported apps](https://github.com/kyleseneker/media-operator/blob/{{ .Tag }}/README.md#supported-apps)
  extra_files:
    - glob: config/crd/bases/*.yaml

# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    ignore_usernames:
      - renovate[bot]
  path_filters:
    - "!api/**/zz_generated.deepcopy.go"
    - "!config/crd/bases/**"
    - "!chart/arrchitect/files/crds/**"
    - "!docs/api.md"
  tools:
    # CI runs golangci-lint with the repo's kube-api-linter plugin, which
    # CodeRabbit can't load.
    golangci-lint:
      enabled: false
